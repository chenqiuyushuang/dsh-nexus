name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: typecheck (node + client)
        run: npm run typecheck
      - name: unit + golden regression
        run: npm test
      - name: build (lib/index.js + lib/client.js + panel)
        run: npm run build

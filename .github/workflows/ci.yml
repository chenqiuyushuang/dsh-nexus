name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: typecheck (node + client)
        run: npm run typecheck
      - name: unit + golden regression
        run: npm test
      - name: build (lib/index.js + lib/client.js + panel)
        run: npm run build
      # 包体门禁：内容与当前构建逐字节一致、无源码/测试/截图泄露、无构建中间产物、体积上限
      # （file: tarball 是本插件的实际分发方式，踩过「同名同版本 pnpm 不更新」与「包体过期」两个坑）
      - name: check package contents
        run: npm run check:pack

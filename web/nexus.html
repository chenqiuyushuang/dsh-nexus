<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus 记忆</title>
<style>
:root { --bg:#f7f7f8; --card:#ffffff; --line:#e5e5ea; --text:#1c1c1e; --muted:#8e8e93; --accent:#4f6ef7; --ok:#34c759; --warn:#ff9f0a; --bad:#ff3b30; }
* { box-sizing: border-box; }
body { margin:0; font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
.wrap { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; }
header { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
header .logo { width:36px; height:36px; flex:none; display:flex; align-items:center; justify-content:center; border-radius:10px; background:linear-gradient(135deg,#4f6ef7,#8a5cf6); color:#fff; }
header h1 { font-size:20px; margin:0; letter-spacing:.5px; }
header p { margin:0; font-size:12px; color:var(--muted); }
.stats { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 14px; }
.chip { padding:6px 12px; background:var(--card); border:1px solid var(--line); border-radius:999px; font-size:12.5px; color:var(--text); }
.chip b { font-weight:600; }
.chip.ok b { color:var(--ok); } .chip.warn b { color:var(--warn); } .chip.bad b { color:var(--bad); } .chip.accent b { color:var(--accent); }
.toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
input,select,button { font:inherit; }
input[type=search], select { padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); outline:none; }
input[type=search] { flex:1; min-width:160px; }
input[type=search]:focus, select:focus { border-color:var(--accent); }
.list { display:flex; flex-direction:column; gap:8px; }
.row { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
.row .head { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
.tags { display:flex; gap:6px; flex-wrap:wrap; }
.tag { font-size:11px; padding:2px 8px; border-radius:999px; background:#eef1ff; color:var(--accent); }
.tag.slot-user { background:#eaf6ee; color:#248a3d; }
.tag.slot-project { background:#fff4e5; color:#c77700; }
.tag.slot-episode { background:#f2eafe; color:#7a3fc9; }
.tag.slot-feedback { background:#e5f2fb; color:#1c7ec2; }
.tag.slot-reference { background:#f4f4f6; color:#5b5b62; }
.tag.status-pending { background:#fff4e5; color:#c77700; }
.tag.status-needs-review { background:#ffeceb; color:#d0342a; }
.tag.status-archived, .tag.status-superseded { background:#f2f2f4; color:var(--muted); }
.row .statement { margin:8px 0 2px; white-space:pre-wrap; word-break:break-word; }
.row .meta { font-size:11.5px; color:var(--muted); display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
.row .actions { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
button.btn { padding:5px 12px; border:1px solid var(--line); background:#fff; border-radius:7px; cursor:pointer; font-size:12.5px; color:var(--text); }
button.btn:hover { border-color:var(--accent); color:var(--accent); }
button.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
button.btn.danger { color:#d0342a; }
button.btn:disabled { opacity:.45; cursor:default; }
.neighbors { margin-top:8px; padding:8px 10px; background:#fafafa; border:1px dashed var(--line); border-radius:8px; font-size:12.5px; }
.neighbors .n-item { padding:3px 0; }
.neighbors .n-edge { color:var(--muted); margin-right:6px; }
.empty { text-align:center; color:var(--muted); padding:40px 0 20px; }
footer { margin-top:18px; font-size:11.5px; color:var(--muted); text-align:center; }
.banner { margin-bottom:12px; padding:8px 12px; border-radius:8px; background:#fff8e6; border:1px solid #f2e2ae; color:#8a6100; font-size:12.5px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/><path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/><path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/></svg></div>
    <div>
      <h1>Nexus 记忆</h1>
      <p>DeepSeek Harness 零配置记忆层 · 本地存储 · 自动分层与成本保护</p>
    </div>
  </header>
  <div id="banner"></div>
  <div class="stats" id="stats"></div>
  <div class="toolbar">
    <input type="search" id="q" placeholder="搜索记忆内容…" oninput="debouncedLoad()">
    <select id="scope" onchange="load()">
      <option value="">全部作用域</option><option value="user">用户</option><option value="project">项目</option><option value="episode">会话</option>
    </select>
    <select id="status" onchange="load()">
      <option value="">全部状态</option><option value="pending">待确认</option><option value="needs-review">冲突</option><option value="active">活跃</option><option value="archived">已归档</option><option value="superseded">已取代</option>
    </select>
    <button class="btn" onclick="load()">刷新</button>
  </div>
  <div class="list" id="list"><div class="empty">加载中…</div></div>
  <footer>记忆保存在本机 <code>~/.dsh/nexus</code>；也可用 <code>/memory list</code>、<code>/memory search</code> 在会话中查看。</footer>
</div>
<script>
var timer = null;
function debouncedLoad(){ clearTimeout(timer); timer = setTimeout(load, 250); }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function j(u, o){ return fetch(u, o).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }); }
var SLOT_NAME = { personal:'个人', user:'个人', project:'项目', episode:'会话', feedback:'反馈', reference:'资料' };
var STATUS_NAME = { pending:'待确认', 'needs-review':'冲突', active:'活跃', archived:'已归档', superseded:'已取代', rejected:'已拒绝' };
function load(){
  var q = document.getElementById('q').value.trim();
  var scope = document.getElementById('scope').value;
  j('/nexus/api/state').then(function(st){
    var chips = [
      ['活跃', st.active, 'ok'],
      ['待确认', st.pending, 'warn'],
      ['冲突', st.conflicts, 'bad'],
      ['降级', st.degraded ? '是' : '否', st.degraded ? 'warn' : ''],
      ['注入 in/out', (st.cost.inject.inputTokens||0)+' / '+(st.cost.inject.outputTokens||0)+' tok', ''],
      ['提炼 in/out', (st.cost.extract.inputTokens||0)+' / '+(st.cost.extract.outputTokens||0)+' tok', '']
    ];
    var s = document.getElementById('stats');
    s.innerHTML = chips.map(function(c){ return '<span class="chip '+(c[2]||'')+'">'+esc(c[0])+' <b>'+esc(c[1])+'</b></span>'; }).join('');
    document.getElementById('banner').innerHTML = st.degraded
      ? '<div class="banner">⚠ 近 7 天未使用记忆注入，已自动降级为「不注入」（节省 token）。继续使用后会逐步恢复。</div>' : '';
  }).catch(function(){ document.getElementById('stats').innerHTML = '<span class="chip bad">状态获取失败</span>'; });
  var url = '/nexus/api/memory?q='+encodeURIComponent(q)+'&scope='+encodeURIComponent(scope)+'&limit=80';
  j(url).then(function(items){
    var st = document.getElementById('status').value;
    if (st) items = items.filter(function(a){ return a.status === st; });
    var list = document.getElementById('list');
    if (items.length === 0){ list.innerHTML = '<div class="empty">暂无记忆。会话中我会自动提炼并保存值得记住的信息。</div>'; return; }
    list.innerHTML = items.map(function(a){
      var tags = '<span class="tag">'+esc(a.scope)+'</span>'
        + '<span class="tag slot-'+esc(a.slot)+'">'+esc(SLOT_NAME[a.slot]||a.slot)+'</span>'
        + ((a.status !== 'active') ? '<span class="tag status-'+esc(a.status)+'">'+esc(STATUS_NAME[a.status]||a.status)+'</span>' : '')
        + (a.pinned ? '<span class="tag">★ 置顶</span>' : '');
      var actions = '';
      if (a.status === 'pending' || a.status === 'needs-review') actions += '<button class="btn primary" onclick="confirmOne(\''+esc(a.id)+'\')">确认</button>';
      actions += '<button class="btn" onclick="editOne(\''+esc(a.id)+'\')">编辑</button>';
      actions += '<button class="btn danger" onclick="rejectOne(\''+esc(a.id)+'\')">归档</button>';
      actions += '<button class="btn" onclick="neighbors(\''+esc(a.id)+'\')">关系</button>';
      return '<div class="row">'
        + '<div class="head"><div class="tags">'+tags+'</div></div>'
        + '<div class="statement">'+esc(a.statement)+'</div>'
        + '<div class="meta"><span>'+esc(a.id)+'</span><span>权重 '+esc(a.weight)+' · 置信 '+esc(Math.round((a.confidence||0)*100))+'%</span><span>更新 '+esc(new Date(a.updatedAt).toLocaleString())+'</span></div>'
        + '<div class="actions">'+actions+'</div>'
        + '<div class="neighbors" id="nb-'+esc(a.id)+'" style="display:none">加载中…</div>'
        + '</div>';
    }).join('');
  }).catch(function(e){ document.getElementById('list').innerHTML = '<div class="empty">加载失败：'+esc(e.message)+'</div>'; });
}
function neighbours(id){ return j('/nexus/api/neighbors?id='+encodeURIComponent(id)); }
function neighbors(id){
  var box = document.getElementById('nb-'+id);
  if (!box) return;
  var show = box.style.display !== 'none';
  if (show){ box.style.display = 'none'; return; }
  neighbours(id).then(function(ns){
    if (!ns || ns.length === 0){ box.innerHTML = '<div class="n-item">暂无关联记忆。</div>'; }
    else { box.innerHTML = ns.map(function(n){
        return '<div class="n-item"><span class="n-edge">'+esc(n.edge || '相关')+'</span>'+esc((n.atom||{}).statement || (n.other || ''))+'</div>';
      }).join(''); }
    box.style.display = 'block';
  }).catch(function(e){ box.innerHTML = '<div class="n-item">关系查询失败：'+esc(e.message)+'</div>'; box.style.display='block'; });
}
function post(id, statement){
  var body = { id: id };
  if (statement !== undefined) body.statement = statement;
  return j('/nexus/api/memory/update', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body) });
}
function confirmOne(id){ j('/nexus/api/memory/confirm',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ids:[id]})}).then(load).catch(function(e){ alert('确认失败：'+e.message); }); }
function rejectOne(id){ if(!confirm('确认归档这条记忆？（不会删除，可回溯）')) return; j('/nexus/api/memory/reject',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ids:[id]})}).then(load).catch(function(e){ alert('归档失败：'+e.message); }); }
function editOne(id){
  var box = document.getElementById('nb-'+id);
  var row = box ? box.closest('.row') : null;
  var text = row ? row.querySelector('.statement').textContent : '';
  var next = prompt('编辑记忆内容：', text);
  if (next === null) return;
  post(id, next.trim()).then(load).catch(function(e){ alert('编辑失败：'+e.message); });
}
load();
setInterval(function(){ if(!document.hidden) load(); }, 15000);
</script>
</body>
</html>

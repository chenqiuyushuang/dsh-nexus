.nx-b .lib-search::placeholder { color: var(--text-3); }
.nx-b .lib-select { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-2); border-radius: 6px; padding: 6px 8px; font: inherit; font-size: 12px; }
.nx-b .lib-select:focus { outline: none; border-color: var(--blue); }
.nx-b .btn-add-new { background: var(--blue); border: 0; color: #fff; border-radius: 6px; font: inherit; font-size: 12.5px; font-weight: 600; padding: 6px 12px; cursor: pointer; flex: none; }
.nx-b .btn-add-new:hover { filter: brightness(1.08); }

/* 批量栏 */
.nx-b .batch-bar { display: none; align-items: center; gap: 8px; padding: 8px 10px; margin-bottom: 8px;
  background: var(--blue-bg); border: 1px solid var(--blue); border-radius: 6px; font-size: 12px; color: var(--blue); flex-wrap: wrap; }
.nx-b .batch-bar.show { display: flex; }
.nx-b .batch-bar .batch-info { flex: 1 1 auto; }
.nx-b .batch-bar .batch-info strong { font-variant-numeric: tabular-nums; }
.nx-b .batch-bar button { background: transparent; border: 1px solid var(--blue); color: var(--blue); border-radius: 5px; font: inherit; font-size: 11.5px; padding: 3px 9px; cursor: pointer; }
.nx-b .batch-bar button:hover { background: var(--blue-bg); }
.nx-b .batch-bar button.danger { border-color: var(--red); color: var(--red); }
.nx-b .batch-bar button.danger:hover { background: var(--red-bg); }

/* 记忆库列表 */
.nx-b .lib-list { display: flex; flex-direction: column; gap: 6px; }
.nx-b .lib-item { display: flex; align-items: flex-start; gap: 9px; padding: 9px 11px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; position: relative; }
.nx-b .lib-item:hover { border-color: var(--text-3); }
.nx-b .lib-item.pinned::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px; background: var(--orange); border-radius: 0 2px 2px 0; }
.nx-b .lib-item.selected { border-color: var(--blue); background: var(--blue-bg); }
.nx-b .lib-item-check { margin-top: 2px; accent-color: var(--blue); width: 14px; height: 14px; flex: none; }
.nx-b .lib-item-body { flex: 1 1 auto; min-width: 0; cursor: pointer; }
.nx-b .lib-item-title { font-size: 12.5px; line-height: 1.45; word-break: break-word; }
.nx-b .lib-item-title mark { background: rgba(245, 158, 11, .28); color: var(--orange); border-radius: 2px; padding: 0 2px; }
.nx-b .lib-item-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 4px; font-size: 11px; color: var(--text-3); }
.nx-b .lib-item-sub .status-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--text-3); }
.nx-b .lib-item-sub .status-dot.active { background: var(--green); }
.nx-b .lib-item-sub .status-dot.pending { background: var(--orange); }
.nx-b .lib-item-sub .status-dot.archived { background: var(--text-3); }
.nx-b .lib-item-sub .status-dot.conflict { background: var(--red); }
.nx-b .lib-item-sub .sep-dot { opacity: .6; }
.nx-b .lib-item-size { flex: none; font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.nx-b .lib-item-more { background: transparent; border: 0; color: var(--text-3); cursor: pointer; font-size: 14px; padding: 0 4px; opacity: 0; transition: opacity .12s; font-family: inherit; }
.nx-b .lib-item:hover .lib-item-more { opacity: 1; }
.nx-b .lib-item-more:hover { color: var(--text); }

/* 回收站 */
.nx-b .trash-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 12px; color: var(--text-3); flex-wrap: wrap; }
.nx-b .trash-toolbar .trash-count strong { color: var(--text); font-variant-numeric: tabular-nums; }
.nx-b .btn-empty-trash { margin-left: auto; background: transparent; border: 1px solid var(--red); color: var(--red); border-radius: 6px; font: inherit; font-size: 12px; padding: 4px 10px; cursor: pointer; }
.nx-b .btn-empty-trash:hover { background: var(--red-bg); }

/* 设置 */
.nx-b .settings-section { border: 1px solid var(--border); border-radius: var(--radius); padding: 11px 12px; margin-bottom: 10px; background: var(--bg-card); }
.nx-b .settings-section:last-child { margin-bottom: 0; }
.nx-b .settings-title { font-size: 12.5px; font-weight: 600; color: var(--text); margin-bottom: 9px; }
.nx-b .setting-row { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 12.5px; }
.nx-b .setting-row .label { flex: 1 1 auto; min-width: 0; color: var(--text-2); }
.nx-b .setting-row input[type="number"] { width: 76px; background: var(--bg-input); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 12.5px; }
.nx-b .setting-row input[type="number"]:focus { outline: none; border-color: var(--blue); }
.nx-b .doctor-block { font-size: 12px; color: var(--text-2); line-height: 1.7; }
.nx-b .doctor-block .row { display: flex; gap: 8px; }
.nx-b .doctor-block .dim { color: var(--text-3); min-width: 72px; }
.nx-b .doctor-block .ok { color: var(--green); }
.nx-b .doctor-block .warn { color: var(--orange); }
.nx-b .setting-select, .nx-b .setting-text { background: var(--bg-input); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 12.5px; }
.nx-b .setting-select:focus, .nx-b .setting-text:focus { outline: none; border-color: var(--blue); }
.nx-b .setting-hint { font-size: 11px; color: var(--text-3); margin-top: 4px; line-height: 1.5; }

/* 二级弹窗 */
.nx-b .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
.nx-b .modal-overlay.show { display: flex; }
.nx-b .modal-card { width: 100%; max-width: 380px; max-height: 88vh; display: flex; flex-direction: column; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.nx-b .modal-card.narrow { max-width: 340px; }
.nx-b .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--border); flex: none; }
.nx-b .modal-title { font-size: 13.5px; font-weight: 600; }
.nx-b .modal-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 12px 14px; }
.nx-b .modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--border); flex: none; }
.nx-b .field { margin-bottom: 10px; }
.nx-b .field > label { display: block; font-size: 11.5px; color: var(--text-2); margin-bottom: 5px; }
.nx-b .field > label .hint { color: var(--text-3); }
.nx-b .field-textarea { width: 100%; min-height: 84px; background: var(--bg-input); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 8px 10px; font: inherit; font-size: 12.5px; line-height: 1.5; resize: vertical; }
.nx-b .field-textarea:focus { outline: none; border-color: var(--blue); }
.nx-b .conf-row { display: flex; align-items: center; gap: 10px; }
.nx-b .conf-row input[type="range"] { flex: 1 1 auto; accent-color: var(--blue); }
.nx-b .conf-value { width: 42px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text); }
.nx-b .chip-group { display: flex; flex-wrap: wrap; gap: 6px; }
.nx-b .chip { background: var(--bg-input); border: 1px solid var(--border); color: var(--text-2); border-radius: 999px; font: inherit; font-size: 11.5px; padding: 3px 10px; cursor: pointer; }
.nx-b .chip:hover { border-color: var(--text-3); color: var(--text); }
.nx-b .chip.active { border-color: var(--blue); background: var(--blue-bg); color: var(--blue); }
.nx-b .impact-hint { font-size: 11.5px; color: var(--text-3); line-height: 1.5; }
.nx-b .impact-hint.info { color: var(--blue); }
.nx-b .related-list { max-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
.nx-b .related-item { display: flex; align-items: flex-start; gap: 8px; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; }
.nx-b .related-item:hover { background: var(--bg-hover); }
.nx-b .related-item .rel-text { flex: 1 1 auto; min-width: 0; }
.nx-b .related-item .rel-scope { color: var(--text-3); font-size: 11px; margin-top: 3px; }
.nx-b .related-item .rel-check { width: 14px; height: 14px; border: 1px solid var(--border); border-radius: 4px; flex: none; margin-top: 1px; }

/* ⋯ 菜单 */
.nx-b .menu-popup { position: fixed; z-index: 60; min-width: 160px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 16px 40px rgba(0, 0, 0, .6); padding: 5px; display: none; }
.nx-b .menu-popup.show { display: block; }
.nx-b .menu-item { padding: 7px 10px; font-size: 12.5px; color: var(--text); border-radius: 5px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
.nx-b .menu-item:hover { background: var(--bg-hover); }
.nx-b .menu-item.danger { color: var(--red); }
.nx-b .menu-item.danger:hover { background: var(--red-bg); }
.nx-b .menu-divider { height: 1px; background: var(--border); margin: 4px 0; }

/* Toast */
.nx-b .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(8px); background: var(--bg-card);
  border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 9px 14px; font-size: 12.5px;
  display: flex; align-items: center; gap: 12px; box-shadow: 0 12px 32px rgba(0, 0, 0, .5); opacity: 0; pointer-events: none;
  transition: opacity .18s, transform .18s; z-index: 70; }
.nx-b .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
.nx-b .toast .undo { background: transparent; border: 1px solid var(--border); color: var(--blue); border-radius: 5px; font: inherit; font-size: 11.5px; padding: 2px 8px; cursor: pointer; }
.nx-b .toast .undo:hover { border-color: var(--blue); }

/* 空态 */
.nx-b .empty-hint { text-align: center; padding: 26px 12px; color: var(--text-3); font-size: 12.5px; }
.nx-b .empty-hint .sub { font-size: 12px; margin-top: 6px; color: var(--text-3); opacity: .7; }

/* 面板本体是 fixed 覆盖层，窄栏里给足高度 */
html.embedded .nx-b { min-height: 100%; }

</style>

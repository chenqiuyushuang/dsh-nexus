<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus 记忆</title>
<style>
/*
 * Nexus /nexus 面板主题。
 *
 * 所有 --nx-* 值抽取自 deepseek-harness/packages/client/ui-theme/src/styles/
 * {base,corner-shape,design-platform}.css，与本仓库无关；DSH 升级相应 token 时须同步。
 * 独立页不在 DSH SPA 内，无法复用运行时 token 注入，故在此内联对齐值。
 *
 * 暗色切换沿用 DSH 的 body[data-ds-dark-theme]（由 src/ui/index.ts 依据
 * prefers-color-scheme 设置），与 DSH ThemePresenter 行为一致。
 */

/* ---- 静态色（design-platform.css --dsw-static-*，亮暗一致，仅列面板用到的） ---- */
body {
  --nx-static-neutral-200: rgb(229, 229, 229);
  --nx-static-neutral-300: rgb(212, 212, 212);
  --nx-static-neutral-bluish-00: rgb(255, 255, 255);
  --nx-static-neutral-bluish-50: rgb(249, 250, 251);
  --nx-static-neutral-bluish-60: rgb(245, 246, 247);
  --nx-static-neutral-bluish-75: rgb(241, 243, 245);
  --nx-static-neutral-bluish-100: rgb(235, 238, 242);
  --nx-static-neutral-bluish-150: rgb(233, 236, 242);
  --nx-static-neutral-bluish-200: rgb(225, 229, 238);
  --nx-static-neutral-bluish-300: rgb(207, 211, 214);
  --nx-static-neutral-bluish-400: rgb(173, 178, 184);
  --nx-static-neutral-bluish-500: rgb(151, 157, 166);
  --nx-static-neutral-bluish-600: rgb(129, 133, 140);
  --nx-static-neutral-bluish-700: rgb(97, 102, 107);
  --nx-static-neutral-bluish-750: rgb(67, 69, 74);
  --nx-static-neutral-bluish-800: rgb(53, 54, 56);
  --nx-static-neutral-bluish-850: rgb(44, 44, 46);
  --nx-static-neutral-bluish-875: rgb(35, 35, 36);
  --nx-static-neutral-bluish-900: rgb(27, 27, 28);
  --nx-static-neutral-bluish-950: rgb(21, 21, 23);
  --nx-static-neutral-bluish-1000: rgb(15, 17, 21);
  --nx-static-deepseek-50: rgb(237, 243, 254);
  --nx-static-deepseek-100: rgb(228, 237, 253);
  --nx-static-deepseek-400: rgb(103, 158, 254);
  --nx-static-deepseek-500: rgb(65, 118, 230);
  --nx-static-deepseek-600: rgb(40, 92, 200);
  --nx-static-deepseek-800: rgb(52, 65, 91);
  --nx-static-green-100: rgb(230, 250, 237);
  --nx-static-green-400: rgb(78, 209, 126);
  --nx-static-green-500: rgb(34, 197, 94);
  --nx-static-green-900: rgb(35, 60, 44);
  --nx-static-amber-100: rgb(254, 245, 231);
  --nx-static-amber-500: rgb(245, 158, 11);
  --nx-static-amber-400: rgb(251, 191, 36);
  --nx-static-amber-600: rgb(221, 134, 41);
  --nx-static-amber-700: rgb(163, 98, 20);
  --nx-static-amber-900: rgb(39, 36, 31);
  --nx-static-red-100: rgb(254, 226, 226);
  --nx-static-red-300: rgb(252, 165, 165);
  --nx-static-red-700: rgb(185, 15, 15);
  --nx-static-red-400: rgb(242, 90, 90);
  --nx-static-red-500: rgb(239, 68, 68);
  --nx-static-red-600: rgb(236, 19, 19);
  --nx-static-red-900: rgb(87, 12, 12);
}

/* ---- 全局固定 token ---- */
:root {
  /* 字体栈（base.css --dsw-font-family / --ds-font-family-code） */
  --nx-font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
    'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --nx-font-code: 'SF Mono', 'JetBrains Mono', 'Fira Code', Consolas, 'Liberation Mono', Menlo,
    Courier, 'PingFang SC', 'Microsoft YaHei';
  /* 圆角（corner-shape.css superellipse(1.5)；提供 border-radius 回退） */
  --nx-radius: 12px;
  --nx-radius-sm: 8px;
  /* 阴影（base.css --dsw-shadow-lv1 / lv2） */
  --nx-shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.05);
  --nx-shadow-lv2: 0 4px 12px 0 rgba(0, 0, 0, 0.02), 0 2px 8px 0 rgba(0, 0, 0, 0.04);
  /* 内容字号（theme-settings：默认 14，范围 12-17） */
  --nx-content-font-size: 14px;
  --nx-content-font-line: 1.65;
}

/* ---- 亮色 alias（design-platform.css body alias） ---- */
body {
  --nx-bg-base: var(--nx-static-neutral-bluish-00);
  --nx-bg-card: var(--nx-static-neutral-bluish-00);
  --nx-bg-subtle: var(--nx-static-neutral-bluish-50);
  --nx-bg-hover: var(--nx-static-neutral-bluish-75);
  --nx-bg-active: var(--nx-static-neutral-bluish-100);
  --nx-bg-accent: var(--nx-static-deepseek-50);
  --nx-border: var(--nx-static-neutral-bluish-150);
  --nx-border-strong: var(--nx-static-neutral-bluish-400);
  --nx-text: var(--nx-static-neutral-bluish-1000);
  --nx-text-secondary: var(--nx-static-neutral-bluish-800);
  --nx-text-tertiary: var(--nx-static-neutral-bluish-700);
  --nx-text-muted: var(--nx-static-neutral-bluish-700);
  --nx-accent: var(--nx-static-deepseek-500);
  /* 文字用的强调色（accent 本身在白底只有 4.23:1，不够 4.5） */
  --nx-accent-text: var(--nx-static-deepseek-600);
  --nx-accent-hover: var(--nx-static-deepseek-400);
  --nx-accent-soft: var(--nx-static-deepseek-100);
  --nx-primary: var(--nx-static-neutral-bluish-1000);
  --nx-primary-text: var(--nx-static-neutral-bluish-00);
  --nx-success: var(--nx-static-green-500);
  --nx-success-soft: var(--nx-static-green-100);
  --nx-success-text: var(--nx-static-green-900);
  --nx-warn: var(--nx-static-amber-500);
  --nx-warn-soft: var(--nx-static-amber-100);
  --nx-warn-text: var(--nx-static-amber-700);
  --nx-error: var(--nx-static-red-600);
  --nx-error-soft: var(--nx-static-red-100);
  --nx-error-text: var(--nx-static-red-700);
  --nx-scrollbar-thumb: var(--nx-static-neutral-200);
  --nx-scrollbar-thumb-hover: var(--nx-static-neutral-300);
  --nx-bg-card-elevated: var(--nx-static-neutral-bluish-00);
  --nx-border-card: rgba(0, 0, 0, 0.1);
  /* 标签底色：暗色用半透明白叠加，保证与行底 ΔL* ≥ 3（原来两者同色 → 标签看不见） */
  --nx-tag-bg: var(--nx-bg-active);
  /* 非文本对比 ≥3:1（WCAG 1.4.11）：绿-500/琥珀-500 在白底只有 2.3/2.15 —— 色条是折叠行唯一的作用域载体 */
  --nx-sbar-user: var(--nx-static-green-900);
  --nx-sbar-project: var(--nx-static-amber-700);
  --nx-sbar-episode: var(--nx-static-deepseek-600);
  /* 置信度圆点（8px，非文本 → 需 ≥3:1）：与色条同因同解，绿-500/琥珀-500/红-500 在白底只有 2.3/2.15/3.4 */
  --nx-conf-high: var(--nx-static-green-900);
  --nx-conf-mid: var(--nx-static-amber-700);
  --nx-conf-low: var(--nx-static-red-700);
}

/* ---- 暗色 alias（design-platform.css body[data-ds-dark-theme] alias） ---- */
body[data-ds-dark-theme] {
  --nx-bg-base: var(--nx-static-neutral-bluish-850);
  --nx-bg-card: var(--nx-static-neutral-bluish-850);
  --nx-bg-subtle: var(--nx-static-neutral-bluish-900);
  --nx-bg-hover: var(--nx-static-neutral-bluish-850);
  --nx-bg-active: var(--nx-static-neutral-bluish-800);
  --nx-bg-accent: var(--nx-static-neutral-bluish-800);
  --nx-border: var(--nx-static-neutral-bluish-700);
  --nx-border-strong: var(--nx-static-neutral-bluish-600);
  --nx-text: var(--nx-static-neutral-bluish-50);
  --nx-text-secondary: var(--nx-static-neutral-bluish-300);
  --nx-text-tertiary: var(--nx-static-neutral-bluish-400);
  --nx-text-muted: var(--nx-static-neutral-bluish-500);
  --nx-accent: var(--nx-static-deepseek-400);
  --nx-accent-text: var(--nx-static-deepseek-400);
  --nx-accent-hover: var(--nx-static-deepseek-500);
  --nx-accent-soft: var(--nx-static-deepseek-800);
  --nx-primary: var(--nx-static-neutral-bluish-50);
  --nx-primary-text: var(--nx-static-neutral-bluish-1000);
  --nx-success: var(--nx-static-green-500);
  --nx-success-soft: var(--nx-static-green-900);
  --nx-success-text: var(--nx-static-green-400);
  --nx-warn: var(--nx-static-amber-500);
  --nx-warn-soft: var(--nx-static-amber-900);
  --nx-warn-text: var(--nx-static-amber-400);
  --nx-error: var(--nx-static-red-400);
  --nx-error-soft: var(--nx-static-red-900);
  --nx-error-text: var(--nx-static-red-300);
  --nx-scrollbar-thumb: var(--nx-static-neutral-bluish-700);
  --nx-scrollbar-thumb-hover: var(--nx-static-neutral-bluish-600);
  --nx-bg-card-elevated: var(--nx-static-neutral-bluish-800);
  --nx-border-card: rgba(255, 255, 255, 0.12);
  --nx-tag-bg: rgba(255, 255, 255, 0.10);
  --nx-sbar-user: var(--nx-static-green-500);
  --nx-sbar-project: var(--nx-static-amber-500);
  --nx-sbar-episode: var(--nx-static-deepseek-400);
  --nx-conf-high: var(--nx-static-green-500);
  --nx-conf-mid: var(--nx-static-amber-500);
  --nx-conf-low: var(--nx-static-red-400);
}

/* ---- 页面基础 ---- */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font: var(--nx-content-font-size) / var(--nx-content-font-line) var(--nx-font);
  background: var(--nx-bg-base);
  color: var(--nx-text);
  -webkit-font-smoothing: antialiased;
}
html.embedded, html.embedded body, html.embedded #root { height: 100%; margin: 0; }
/* 嵌入态：面板固定高，只有列表滚动 —— 头部/统计/工具条永远可见（UI 专家共识） */
html.embedded .nx-app { height: 100%; display: flex; flex-direction: column; padding-bottom: 0; }
/* 关键：flex 列里的其它子项必须 flex: none，否则会被压缩。
   实测（设置弹窗窄栏 372x460）：注入条有 overflow:hidden → 自动最小高度为 0
   → 被压成 6px 整条消失，工具栏被压、列表只剩 1 行。 */
html.embedded .nx-app > * { flex: none; }
/* 参考稿是长列表；窄栏里网格行与 flex 子项都必须显式 min-height:0，否则 0fr 塌不下去 */
.nx-list > .nx-row { min-height: 0; flex: 0 0 auto; }
.nx-disclosure { min-height: 0; }
html.embedded .nx-list { flex: 1 1 auto; min-height: 160px; overflow-y: auto; padding-bottom: 12px; }
/* 窄栏：页脚信息价值低却占 63px（比列表还高），让位给列表 */
html.embedded .nx-footer { display: none; }
/* 窄栏：统计与工具栏收紧，计数不再独占一行 */
html.embedded .nx-stats { gap: 6px; margin-bottom: 8px; }
html.embedded .nx-toolbar { gap: 6px; margin-bottom: 8px; }
html.embedded .nx-search { min-width: 132px; }
html.embedded .nx-count { margin-left: 0; }
/* 窄栏：注入条允许换行，别把「未进入 N」挤出可视区 */
html.embedded .nx-inject-bar { flex-wrap: wrap; row-gap: 4px; }
/* 窄栏：控件整体收紧一档（搜索框 + 2 个下拉 + 3 个按钮 + 计数 = 2 行） */
/* 字号用相对单位跟随宿主（原 12px 硬编码：17px 宿主下正文变大而控件不变）；
   内边距仍用 px 保密度 —— 实测 17/20px 宿主下工具栏仍 3 行、列表 3–6 行、头部不滚走 */
html.embedded .nx-select-trigger { padding: 5px 8px; font-size: 0.86em; }
html.embedded .nx-btn { padding: 5px 9px; font-size: 0.86em; }
html.embedded .nx-chip { font-size: 0.86em; }
html.embedded .nx-count { font-size: 0.86em; }
html.embedded .nx-line-status { font-size: 0.86em; }
html.embedded .nx-tool-more { display: none; }
/* 窄栏：注入条只留数字（进度条与「进入上下文」标签可省，数字自明）→ 单行 40px 而不是两行 67px */
html.embedded .nx-inject-meter { display: none; }
html.embedded .nx-inject-title { display: none; }
html.embedded .nx-inject-note { display: none; }
/* 窄栏：搜索框独占一行，其余控件才能并排成 2 行 */
/* 窄栏：搜索与作用域同排（搜索不再独占整行），并把统计/占比条压矮一档 */
html.embedded .nx-search { flex: 1 1 120px; min-width: 110px; }
html.embedded .nx-chip { padding: 3px 8px; }
html.embedded .nx-scopebar-track { height: 4px; }
html.embedded .nx-scopebar-legend { margin-top: 4px; font-size: 11px; gap: 8px; }
/* 窄栏：折叠行不再显示「活跃」（无信息量，且占掉约 1/4 正文宽度）；异常状态照常显示 */
html.embedded .nx-line-status.status-active { display: none; }
/* 窄栏：设置条只在点开时才出现 —— 常驻的折叠条用 44px 触摸目标换 3 行列表，不划算；
   展开时自身限高 + 内部滚动，避免把列表压到 160px 最小高度以下 */
html.embedded .nx-settings:not(.open) { display: none; }
/* 数字输入框不该带放大镜（复用 .nx-search 的样式继承到了背景图标） */

html.embedded .nx-settings-body .nx-disclosure-inner { max-height: 260px; overflow-y: auto; overscroll-behavior: contain; }
/* 窄栏：占用卡与工具栏各收一档（参考稿是 780 宽弹窗，这里要腾出行高） */
/* 窄栏：噪音横幅 94px ≈ 一行记忆 → 收成一条细提示（内容不删，只是不抢首屏） */
html.embedded .nx-banner.noise { padding: 4px 8px; font-size: 11px; margin-bottom: 6px; line-height: 1.45; }
html.embedded .nx-banner.noise .nx-btn { padding: 2px 8px; font-size: 11px; }
html.embedded .nx-progress { padding: 8px 10px; margin-bottom: 6px; }
html.embedded .nx-progress-head { margin-bottom: 6px; }
html.embedded .nx-status-cards { margin-bottom: 6px; gap: 5px; }
html.embedded .nx-status-card { padding: 5px 3px; }
html.embedded .nx-toolbar { margin-bottom: 6px; }
html.embedded .nx-listcard-head { padding: 4px 10px; }
html.embedded .nx-row-head { padding: 7px 10px; gap: 8px; }
/* 窄栏：状态标签让位（折叠行已有圆点 + 副信息，标签在这里是重复信息，且会把标题挤成两行） */
html.embedded .nx-row-head > .nx-tag { display: none; }
html.embedded .nx-row-sub { font-size: 11px; gap: 0 6px; }
/* 窄栏：搜索默认收成放大镜，聚焦后展开 —— 省下一整行工具栏宽度 */
html.embedded .nx-search {
  flex: 0 0 46px; min-width: 46px; padding-left: 28px;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2381858C' stroke-width='2.2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><path d='m20 20-3.5-3.5'/></svg>");
  background-repeat: no-repeat; background-position: 8px center;
}
html.embedded .nx-search:focus { flex: 1 1 auto; min-width: 120px; }
/* 数字输入框复用了 .nx-search 的类 → 会继承放大镜背景图标；阈值输入框不需要（且更窄） */
html.embedded .nx-threshold-input { background-image: none; padding-left: 10px; flex: 0 0 76px; }
/* 窄栏：刷新与全选本页收进「更多」占位（列表每 15s 自动刷新，全选仍可点勾选框） */
/* 嵌入态空间紧张：副标题让位给列表 */
html.embedded .nx-sub { display: none; }

/* B5 反馈层：底部 toast（含撤销） */
.nx-toast { position: sticky; bottom: 0; margin: 8px 0 0; display: flex; align-items: center; gap: 10px;
  background: var(--nx-bg-card-elevated); border: 1px solid var(--nx-border); border-radius: 8px;
  padding: 8px 12px; font-size: 12.5px; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.nx-toast.error { border-color: var(--nx-error); color: var(--nx-error-text); }
.nx-toast .nx-toast-text { flex: 1 1 auto; }
.nx-toast button { border: 1px solid var(--nx-border); background: transparent; color: inherit;
  border-radius: 6px; padding: 2px 10px; cursor: pointer; font: inherit; }
.nx-toast button:hover { border-color: var(--nx-accent); color: var(--nx-accent-text); }

.nx-app { max-width: 880px; margin: 0 auto; padding: 28px 20px 64px; }

/* ---- 头部 ---- */
.nx-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.nx-logo {
  width: 32px; height: 32px; flex: none; display: flex; align-items: center; justify-content: center;
  border-radius: var(--nx-radius-sm); background: var(--nx-accent-soft); color: var(--nx-accent-text);
}
.nx-title { font-size: 18px; font-weight: 600; line-height: 1.4; margin: 0; letter-spacing: 0.2px; color: var(--nx-text); }
.nx-sub { margin: 4px 0 0; font-size: 13px; color: var(--nx-text-tertiary); }

/* ---- 横幅 ---- */
.nx-banner {
  margin: 0 0 12px; padding: 8px 12px; border-radius: var(--nx-radius-sm);
  background: var(--nx-warn-soft); border: 1px solid var(--nx-warn);
  color: var(--nx-warn-text); font-size: 12.5px;
}

/* ---- 统计 --- */
.nx-stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 10px; }
.nx-chip {
  flex: 1; text-align: center; padding: 5px 10px; background: var(--nx-bg-card); border: 1px solid var(--nx-border);
  border-radius: var(--nx-radius-sm); font-size: 12.5px; color: var(--nx-text);
  box-shadow: var(--nx-shadow);
}
.nx-chip b { font-weight: 600; margin-left: 4px; }
.nx-chip.ok b { color: var(--nx-success-text); }
.nx-chip.warn b { color: var(--nx-warn-text); }
.nx-chip.bad b { color: var(--nx-error-text); }
.nx-chip.accent b { color: var(--nx-accent-text); }

/* ---- 工具条 ---- */
.nx-toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 10px; }
.nx-search {
  padding: 8px 12px; border: 1px solid var(--nx-border); border-radius: var(--nx-radius-sm);
  background: var(--nx-bg-card); color: var(--nx-text); font: inherit; outline: none;
  flex: 1; min-width: 140px;
}
.nx-search:focus { border-color: var(--nx-accent); }
.nx-select { position: relative; }
.nx-select-trigger {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  border: 1px solid var(--nx-border); border-radius: var(--nx-radius-sm);
  background: var(--nx-bg-card); color: var(--nx-text); font: inherit; cursor: pointer;
}
.nx-select-trigger:hover { border-color: var(--nx-accent); }
.nx-select-caret { color: var(--nx-text-tertiary); }
.nx-select-menu {
  position: absolute; z-index: 20; top: calc(100% + 6px); left: 0; min-width: 100%;
  background: var(--nx-bg-card); border: 1px solid var(--nx-border); border-radius: var(--nx-radius);
  box-shadow: var(--nx-shadow-lv2); padding: 6px; max-height: 320px; overflow-y: auto;
}
.nx-select-group { padding-top: 2px; }
.nx-select-group-label { padding: 8px 12px 3px; font-size: 11px; color: var(--nx-text-tertiary); }
.nx-select-option {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%;
  padding: 10px 12px; border: none; background: transparent; color: var(--nx-text);
  font: inherit; font-size: 12.5px; text-align: left; cursor: pointer; border-radius: var(--nx-radius-sm);
}
.nx-select-option:hover { background: var(--nx-bg-hover); }
.nx-select-option.selected { color: var(--nx-accent-text); }
.nx-info { margin: -4px 0 12px; font-size: 11.5px; color: var(--nx-text-tertiary); }
.nx-threshold { display: flex; align-items: flex-end; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; font-size: 12px; color: var(--nx-text-secondary); }
.nx-extractor-row { align-items: center; }
.nx-extractor-row .nx-select { flex: 1; }
.nx-extractor-row .nx-select-trigger { width: 100%; min-width: 0; }
.nx-threshold-label { flex: none; }
.nx-threshold-field { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--nx-text-tertiary); }
.nx-threshold-input { flex: none; width: 96px; min-width: 0; padding: 6px 10px; height: auto; }
.nx-threshold-hint { margin: -6px 0 12px; font-size: 11px; color: var(--nx-text-tertiary); }
.nx-settings { margin: 0 0 16px; padding: 12px 14px; background: var(--nx-bg-card); border: 1px solid var(--nx-border-card); border-radius: var(--nx-radius); }
.nx-settings-title { font-size: 12px; color: var(--nx-text-secondary); margin-bottom: 10px; }
.nx-settings-actions { display: flex; justify-content: flex-end; margin-top: 12px; }
.nx-add { display: flex; flex-direction: column; gap: 8px; margin: 0 0 16px; }
.nx-add .nx-edit { margin: 0; }
.nx-edit-wrap { margin: 0; }
.nx-edit-wrap-inner { display: flex; flex-direction: column; gap: 8px; padding: 8px 0 2px; }
.nx-edit-wrap .nx-edit { margin: 0; }

/* ---- 列表 ---- */
.nx-list { display: flex; flex-direction: column; gap: 10px; }
.nx-row {
  background: var(--nx-bg-card-elevated); border: 0.5px solid var(--nx-border-card);
  border-radius: 14px; padding: 14px 16px; transition: border-color .16s;
}
.nx-row:hover { border-color: var(--nx-text-tertiary); }
.nx-row-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.nx-tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.nx-tag-sep { color: var(--nx-text-muted); font-size: 12px; opacity: 0.7; }
.nx-tag {
  font-size: 12px; line-height: 1.5; padding: 2px 9px; border-radius: var(--nx-radius-sm);
  border: 1px solid transparent; background: var(--nx-tag-bg); color: var(--nx-text-secondary);
}
.nx-tag.scope { background: var(--nx-tag-bg); color: var(--nx-text-secondary); }
/* 颜色只给状态：槽位/资料标签一律中性（原来用了 4 种色相，噪音大且与状态抢注意力） */
.nx-tag.slot-personal, .nx-tag.slot-user, .nx-tag.slot-project,
.nx-tag.slot-episode, .nx-tag.slot-feedback, .nx-tag.slot-reference { background: var(--nx-tag-bg); color: var(--nx-text-secondary); }
/* 描边也是非文本：白底上 --nx-success/--nx-warn 只有 2.28/2.15:1，改用文本级 token（≥3:1） */
.nx-tag.status-active { background: transparent; border-color: var(--nx-success-text); color: var(--nx-success-text); }
.nx-tag.status-pending { background: transparent; border-color: var(--nx-warn-text); color: var(--nx-warn-text); }
.nx-tag.status-needs-review { background: transparent; border-color: var(--nx-error-text); color: var(--nx-error-text); }
.nx-tag.status-archived, .nx-tag.status-superseded { background: transparent; border-color: var(--nx-text-muted); color: var(--nx-text-tertiary); }

.nx-statement { margin: 8px 0 2px; white-space: pre-wrap; word-break: break-word; color: var(--nx-text); }
.nx-hint { margin: 6px 0 0; font-size: 12px; color: var(--nx-warn-text); }
.nx-hint.replaced { color: var(--nx-text-tertiary); }
.nx-edit {
  display: block; width: 100%; margin: 8px 0 2px; padding: 8px 12px; border: 1px solid var(--nx-border);
  border-radius: var(--nx-radius-sm); background: var(--nx-bg-card); color: var(--nx-text);
  font: var(--nx-content-font-size) / 1.5 var(--nx-font); resize: vertical; outline: none;
}
.nx-edit:focus { border-color: var(--nx-accent); }
.nx-meta {
  font-size: 11.5px; color: var(--nx-text-tertiary); display: flex; gap: 12px; flex-wrap: wrap;
  align-items: center;
}
.nx-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.nx-btn {
  padding: 6px 14px; border: 1px solid var(--nx-border); background: var(--nx-bg-card);
  border-radius: var(--nx-radius-sm); cursor: pointer; font-size: 12.5px; color: var(--nx-text);
  font-family: inherit; flex: none; white-space: nowrap;
}
.nx-btn:hover { border-color: var(--nx-accent); color: var(--nx-accent-text); }
.nx-btn.primary { background: var(--nx-primary); border-color: var(--nx-primary); color: var(--nx-primary-text); }
.nx-btn.primary:hover { opacity: 0.9; }
.nx-btn.danger { color: var(--nx-error-text); }
.nx-btn.danger:hover { border-color: var(--nx-error); color: var(--nx-error-text); }
.nx-btn:disabled { opacity: 0.45; cursor: default; }

/* ---- 关系 ---- */
.nx-neighbors {
  margin-top: 8px; padding: 8px 10px; background: var(--nx-bg-subtle);
  border: 1px dashed var(--nx-border); border-radius: var(--nx-radius-sm); font-size: 12.5px;
}
.nx-n-item { padding: 3px 0; color: var(--nx-text); }
.nx-n-edge { color: var(--nx-text-tertiary); margin-right: 6px; }

/* 读屏专用文本（视觉隐藏，读屏可读） */
.nx-sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* 隐藏（嵌入态把计数并进注入条，省掉一整行） */
.nx-hidden { display: none; }
/* 状态条里内联的计数（暗色下用次级色，别跟注入数字抢注意力） */
.nx-status-counts { flex: none; font-size: 11.5px; color: var(--nx-text-tertiary); white-space: nowrap; }

/* 条数少时的作用域摘要（替掉那条 26px 的粗彩条） */
.nx-scopeline { margin: 0 0 8px; font-size: 12px; color: var(--nx-text-tertiary); }

/* 阈值说明折叠入口（默认收起，窄栏里那 36px 让给列表） */
.nx-hint-toggle { align-self: flex-start; background: transparent; border: 0; padding: 0; cursor: pointer;
  color: var(--nx-accent-text); font: inherit; font-size: 12px; text-decoration: underline dotted; }

/* ---- B3 列表密度 ---- */
/* 折叠态：标签行 + 两行正文（≤56px）；展开才显示元信息与提示 */
/* 展开指示：折叠行左侧的 ▸（可见的可展开暗示，用户不该靠猜） */
.nx-chevron { flex: none; color: var(--nx-text-tertiary); font-size: 11px; }

/* 展开内容限高 + 内部滚动：一条 400 字记忆在窄栏里是 10 行文字墙，不限高会把整屏推走。
   tabIndex 在组件上（键盘可滚动，WCAG 2.1.1）。 */
/* 96px ≈ 5 行：展开后列表里至少还能看见下一条（120px 时正好占满视口） */
.nx-statement-open { max-height: 96px; overflow-y: auto; overscroll-behavior: contain; }
.nx-statement-open:focus-visible { outline: 2px solid var(--nx-accent); outline-offset: 2px; border-radius: var(--nx-radius-sm); }

/* 单行省略（比多行 clamp 更省高度，滚动扫描更像收件箱） */
.nx-statement.folded {
  flex: 1 1 auto; min-width: 0; margin: 0; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; cursor: pointer;
}
.nx-statement.folded:hover { color: var(--nx-accent-text); }
/* 折叠行高预算：8 + max(勾选框 15 / 正文 18 / ⋯ 22) + 8 ≈ 38px，行距 6 → 每屏 ≥8 条 */
.nx-list { gap: 6px; }
.nx-list .nx-row { padding: 8px 12px; border-radius: var(--nx-radius); }
.nx-row-head { display: flex; align-items: center; gap: 8px; flex-wrap: nowrap; }
.nx-row-head .nx-tags { flex: 1 1 auto; min-width: 0; overflow: hidden; flex-wrap: nowrap; }
/* 作用域色条（B7：颜色只给状态/作用域，不整行染色） */
.nx-sbar { flex: none; width: 3px; height: 16px; border-radius: 2px; background: var(--nx-text-muted); }
.nx-sbar.scope-user { background: var(--nx-sbar-user); }
.nx-sbar.scope-project { background: var(--nx-sbar-project); }
.nx-sbar.scope-episode { background: var(--nx-sbar-episode); }
.nx-line-status { flex: none; font-size: 12px; color: var(--nx-text-tertiary); }
.nx-line-pin { flex: none; font-size: 12px; color: var(--nx-accent-text); }
.nx-check { flex: none; width: 15px; height: 15px; accent-color: var(--nx-accent); cursor: pointer; }
.nx-more {
  flex: none; margin-left: auto; border: 1px solid var(--nx-border); background: transparent;
  color: var(--nx-text-secondary); border-radius: var(--nx-radius-sm); cursor: pointer;
  font: inherit; font-size: 13px; line-height: 18px; padding: 1px 8px;
}
.nx-more:hover { border-color: var(--nx-accent); color: var(--nx-accent-text); }
.nx-row.selected { border-color: var(--nx-accent); background: var(--nx-bg-subtle); }
.nx-menu {
  margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px;
  border: 1px solid var(--nx-border); border-radius: var(--nx-radius-sm); background: var(--nx-bg-card-elevated);
}
.nx-menu-item {
  border: 1px solid var(--nx-border); background: transparent; color: var(--nx-text); font: inherit;
  font-size: 12.5px; border-radius: var(--nx-radius-sm); padding: 3px 10px; cursor: pointer;
}
.nx-menu-item:hover { border-color: var(--nx-accent); color: var(--nx-accent-text); }
.nx-menu-item.danger { color: var(--nx-error-text); border-color: var(--nx-error); }
.nx-menu-note { align-self: center; font-size: 12px; color: var(--nx-text-tertiary); }
.nx-row-more { margin: 0; }
/* 子元素的外边距会撑破 0fr（内层 min-content 变大）→ 统一挪到内层容器的 padding */
.nx-row-more .nx-disclosure-inner { padding-top: 6px; }
.nx-batch {
  /* 吸底且不在列表上方占位：勾选时列表不下移（原来会把第二行勾选框变成移动靶） */
  position: sticky; bottom: 0; z-index: 3; display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  margin: 6px 0 0; padding: 8px 12px; border: 1px solid var(--nx-accent); border-radius: var(--nx-radius);
  background: var(--nx-bg-accent); box-shadow: var(--nx-shadow);
}
.nx-batch-count { font-size: 12.5px; color: var(--nx-text); font-weight: 600; }
.nx-empty-title { color: var(--nx-text); font-weight: 600; margin-bottom: 6px; }
.nx-empty-hint { font-size: 12.5px; color: var(--nx-text-tertiary); }
/* 轻量虚拟化：滚动到视口外不再布局（1000 条以上时首屏只渲染可见行附近） */
.nx-row { content-visibility: auto; contain-intrinsic-size: auto 72px; }

/* 子代理噪音横幅（P0）：既提醒也提供一键清理入口 */
.nx-banner.noise { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.nx-banner.noise b { color: var(--nx-error-text); }

/* ---- B7 作用域占比条（颜色只给作用域/状态） ---- */
.nx-scopebar { margin: 0 0 8px; }
.nx-scopebar-track { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--nx-bg-active); }
.nx-scopebar-track i { display: block; height: 100%; }
.nx-scopebar-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 6px; font-size: 12px; color: var(--nx-text-tertiary); }
.nx-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
.nx-scopebar-track i.scope-user, .nx-dot.scope-user { background: var(--nx-success); }
.nx-scopebar-track i.scope-project, .nx-dot.scope-project { background: var(--nx-warn); }
.nx-scopebar-track i.scope-episode, .nx-dot.scope-episode { background: var(--nx-accent); }

/* ---- B2 分页与计数 ---- */
.nx-count { align-self: center; font-size: 12px; color: var(--nx-text-tertiary); margin-left: auto; font-variant-numeric: tabular-nums; }
.nx-loadmore { display: flex; justify-content: center; padding: 10px 0 4px; }

/* ---- B4 注入真相条 ---- */
.nx-inject { margin: 0 0 8px; border: 1px solid var(--nx-border); border-radius: var(--nx-radius);
  background: var(--nx-bg-card); box-shadow: var(--nx-shadow); overflow: hidden; }
.nx-inject-bar { width: 100%; display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  background: transparent; border: 0; color: var(--nx-text); font: inherit; font-size: 12.5px;
  cursor: pointer; text-align: left; }
.nx-inject-bar:hover { background: var(--nx-bg-hover); }
.nx-inject-meter { flex: none; width: 54px; height: 6px; border-radius: 3px; background: var(--nx-bg-active); overflow: hidden; }
.nx-inject-meter i { display: block; height: 100%; background: var(--nx-accent); }
.nx-inject-title { color: var(--nx-text-secondary); }
.nx-inject-bar b { font-weight: 600; }
.nx-dim { color: var(--nx-text-tertiary); }
.nx-inject-badge { margin-left: auto; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--nx-border);
  color: var(--nx-text-tertiary); white-space: nowrap; }
.nx-inject-badge.warn { border-color: var(--nx-warn); color: var(--nx-warn-text); background: var(--nx-warn-soft); }
.nx-inject-caret { color: var(--nx-accent-text); white-space: nowrap; }
.nx-inject-body { border-top: 1px solid var(--nx-border); padding: 10px 12px 14px; }
.nx-inject-note { color: var(--nx-text-tertiary); font-size: 12px; margin-bottom: 8px; line-height: 1.5; }
.nx-inject-project { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 12.5px; }
.nx-inject-group { margin-top: 10px; }
.nx-inject-group-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  font-size: 12.5px; color: var(--nx-text-secondary); margin-bottom: 6px; }
.nx-inject-tone-bad { color: var(--nx-error-text); }
.nx-inject-tone-warn { color: var(--nx-warn-text); }
.nx-inject-row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px; padding: 6px 8px;
  border-radius: var(--nx-radius-sm); }
.nx-inject-row.in { background: var(--nx-bg-subtle); margin-bottom: 4px; }
.nx-inject-main { flex: 1 1 260px; min-width: 0; }
.nx-inject-subject { font-size: 12.5px; font-weight: 600; }
.nx-inject-statement { font-size: 12px; color: var(--nx-text-secondary); overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.nx-inject-side { display: flex; align-items: center; gap: 6px; flex: none; }
.nx-inject-bytes { font-size: 11.5px; color: var(--nx-text-tertiary); font-variant-numeric: tabular-nums; }
/* 单条吃掉 ≥30% 预算：标黄提醒（颜色只给状态/风险，符合 B7 约束） */
.nx-inject-bytes.heavy, .nx-meta .heavy { color: var(--nx-warn-text); font-weight: 600; }
.nx-inject-actions { display: flex; gap: 6px; flex: 1 1 100%; }
.nx-inject-edit { flex: 1 1 100%; display: flex; flex-direction: column; gap: 6px; }
.nx-inject-edit-meta { font-size: 11.5px; color: var(--nx-text-tertiary); }

/* ---- 空态 / 页脚 ---- */
.nx-empty { text-align: center; color: var(--nx-text-secondary); padding: 40px 0 20px; }
.nx-footer {
  margin-top: 20px; font-size: 11.5px; color: var(--nx-text-tertiary); text-align: center;
}
.nx-footer-meta { margin: 0 0 6px; color: var(--nx-text-tertiary); }
.nx-footer code { font-family: var(--nx-font-code); }

/* ---- 展开/收起动画（参考稿的 grid-template-rows 技法） ----
   为什么不用 max-height 动画：max-height 必须写死像素上界，长内容要么被截断、要么动画后半段是空动画；
   grid-template-rows 的 0fr↔1fr 由浏览器按内容求解，收起到 0、展开到"内容自然高度"，两帧都精确。
   注意内层必须跟一个 overflow:hidden; min-height:0，否则 0fr 塌不下去（min-content 撑住）。 */
.nx-disclosure { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .22s ease; }
.nx-disclosure-inner { overflow: hidden; min-height: 0; }
.nx-disclosure.open { grid-template-rows: 1fr; }
/* 可见提示：折叠行左侧 ▸ 旋转 90°（原来展开/收起只有文字变化） */
.nx-chevron { transition: transform .22s ease; display: inline-block; }
.nx-row.open .nx-chevron { transform: rotate(90deg); }
.nx-row.open .nx-statement.folded { color: var(--nx-text-secondary); }

/* ---- 常驻折叠条：设置区（参考稿 settings-panel）----
   收起时只留标题行（标题永远可见，面板不"凭空多出一块"），点标题整条切换。 */
.nx-settings { margin: 0 0 10px; padding: 0; background: var(--nx-bg-card);
  border: 1px solid var(--nx-border-card); border-radius: var(--nx-radius); overflow: hidden; }
.nx-settings-head {
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 12px;
  background: transparent; border: 0; color: var(--nx-text); font: inherit; font-size: 12.5px;
  text-align: left; cursor: pointer;
}
.nx-settings-head:hover { background: var(--nx-bg-hover); }
.nx-settings-title { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nx-settings-caret { flex: none; color: var(--nx-text-tertiary); transition: transform .22s ease; }
.nx-settings.open .nx-settings-caret { transform: rotate(180deg); }
.nx-settings-body { padding: 0 12px 12px; }

/* ---- 右键菜单（参考稿 context-menu；与行内「⋯」共用同一份菜单项） ---- */
.nx-ctxmenu { position: fixed; z-index: 60; display: flex; flex-direction: column; gap: 2px;
  min-width: 156px; padding: 6px; background: var(--nx-bg-card-elevated);
  border: 1px solid var(--nx-border); border-radius: var(--nx-radius); box-shadow: var(--nx-shadow-lv2); }
.nx-ctxmenu .nx-menu-item { text-align: left; padding: 6px 10px; }
.nx-ctxmenu .nx-menu-note { padding: 4px 8px; }

/* ---- 键盘导航焦点环（参考稿 .focused；与 :hover 同形，键盘用户才看得见自己在哪一行） ---- */
.nx-row.focused { box-shadow: inset 2px 0 0 var(--nx-accent); border-color: var(--nx-accent); }
/* ---- 错误态重试（原来只有一行字，没有出路） ---- */
.nx-empty .nx-btn { margin-top: 10px; }

/* ---- 置信度圆点：折叠行唯一的"这条值不值得信"载体 ----
   颜色不是唯一载体：title/aria-label 给百分数（WCAG 1.4.1）。 ≥3:1 由 --nx-* 文本色保证。 */
.nx-conf { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--nx-text-muted); margin-right: 2px; }
.nx-conf.high { background: var(--nx-conf-high); }
.nx-conf.mid { background: var(--nx-conf-mid); }
.nx-conf.low { background: var(--nx-conf-low); }

/* =====================================================================
   V0.6.1 参考稿布局（用户定稿：按样例 HTML 改）
   结构照搬参考稿：进度卡 → 状态卡 → 设置条 → 工具栏 → 列表容器（表头 + 条目）→ 页脚按钮。
   两处必要偏离（依据见 docs/V0.6-PANEL-EVOLUTION.md）：
   1) 绝对尺寸按 DSH 设置弹窗窄栏（418×448）给"紧凑档"，否则首屏一条记忆都看不到；
   2) 列表容器在窄栏里同时是滚动区（参考稿的 min-height:200px 会把列表推到折叠线下）。
   ===================================================================== */

.nx-progress {
  background: var(--nx-bg-card); border: 1px solid var(--nx-border-card);
  border-radius: var(--nx-radius); padding: 10px 12px; margin: 0 0 8px;
}
.nx-progress-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  font-size: 12px; color: var(--nx-text-secondary); margin-bottom: 8px;
}
.nx-progress-badge {
  padding: 1px 8px; border-radius: 999px; border: 1px solid var(--nx-border);
  color: var(--nx-text-tertiary); font-size: 11px; white-space: nowrap; cursor: pointer;
  background: transparent; font-family: inherit;
}
.nx-progress-badge.warn { border-color: var(--nx-warn); color: var(--nx-warn-text); background: var(--nx-warn-soft); }
.nx-progress-badge:hover { border-color: var(--nx-accent); color: var(--nx-accent-text); }
.nx-progress-track {
  display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--nx-bg-active);
}
.nx-progress-track i { display: block; height: 100%; flex-grow: 1; flex-shrink: 1; flex-basis: 0; }
.nx-progress-track .nx-seg-user { background: var(--nx-sbar-user); }
.nx-progress-track .nx-seg-project { background: var(--nx-sbar-project); }
.nx-progress-track .nx-seg-episode { background: var(--nx-sbar-episode); }
.nx-progress-track .nx-seg-bytes { background: var(--nx-accent); }
.nx-progress-legend {
  display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 6px;
  font-size: 11.5px; color: var(--nx-text-tertiary);
}
.nx-progress-legend b { color: var(--nx-text-secondary); font-weight: 600; font-variant-numeric: tabular-nums; }
.nx-progress-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }

/* 参考稿 .status-grid：4 张卡既是计数也是筛选入口 */
.nx-status-cards { display: flex; gap: 6px; margin: 0 0 8px; }
/* 参考稿是"标签在上、大数字在下"的两行卡；窄栏里改成同卡内联（计数紧贴标签），
   一屏省 22px 给列表 —— 信息一个不少，只是不再竖着排。 */
.nx-status-card {
  flex: 1 1 0; min-width: 0; display: flex; flex-direction: row; align-items: baseline; justify-content: center; gap: 4px;
  padding: 5px 4px; background: var(--nx-bg-card); border: 1px solid var(--nx-border-card);
  border-radius: var(--nx-radius-sm); cursor: pointer; font: inherit; color: var(--nx-text-secondary);
}
.nx-status-card:hover { border-color: var(--nx-accent); }
.nx-status-card.on { border-color: var(--nx-accent); background: var(--nx-bg-accent); }
.nx-status-card-label { font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nx-status-card-value { font-size: 14px; font-weight: 600; color: var(--nx-text); font-variant-numeric: tabular-nums; flex: none; }
.nx-status-card.ok .nx-status-card-value { color: var(--nx-success-text); }
.nx-status-card.warn .nx-status-card-value { color: var(--nx-warn-text); }
.nx-status-card.bad .nx-status-card-value { color: var(--nx-error-text); }

/* 参考稿 .list-container：表头 + 条目包在同一张卡里 */
.nx-listcard {
  background: var(--nx-bg-card); border: 1px solid var(--nx-border-card);
  border-radius: var(--nx-radius); overflow: hidden;
}
.nx-listcard-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 6px 12px; font-size: 11.5px; color: var(--nx-text-tertiary);
  background: var(--nx-bg-subtle); border-bottom: 1px solid var(--nx-border-card);
}
.nx-listcard-head label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
.nx-listcard-head input { accent-color: var(--nx-accent); }

/* 参考稿 .list-item：两行标题 + 副信息 + 状态标签 + 箭头 */
.nx-row {
  border: 0; border-bottom: 1px solid var(--nx-border-card); border-radius: 0;
  background: transparent; padding: 0;
}
.nx-row:last-child { border-bottom: 0; }
.nx-row.open, .nx-row.selected { background: var(--nx-bg-subtle); }
.nx-row-head { display: flex; align-items: flex-start; gap: 10px; padding: 9px 12px; cursor: pointer; }
.nx-row-main { display: flex; flex-direction: column; gap: 2px; flex: 1 1 auto; min-width: 0; }
.nx-row-title {
  font-size: var(--nx-content-font-size); color: var(--nx-text); line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.nx-row-sub { display: flex; flex-wrap: nowrap; align-items: center; gap: 0 8px; font-size: 11.5px;
  color: var(--nx-text-tertiary); white-space: nowrap; overflow: hidden; }
.nx-row-sub > span { flex: none; }
.nx-row-details { background: var(--nx-bg-subtle); }
/* 内边距必须放在 disclosure 的再内一层：放在 .nx-disclosure-inner 上会让 0fr 收起时
   仍然留下 padding 高度（实测每行多 10px 白条）。 */
.nx-row-details-inner { padding: 0 12px 10px; }
.nx-detail-grid { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 11.5px; color: var(--nx-text-tertiary); }
.nx-detail-grid > div { min-width: 0; }
.nx-detail-grid .nx-detail-k { display: block; color: var(--nx-text-muted); }
.nx-detail-grid .nx-detail-v { color: var(--nx-text-secondary); word-break: break-all; }
.nx-rawtext {
  width: 100%; margin: 8px 0 0; padding: 8px 10px; border-radius: var(--nx-radius-sm);
  background: var(--nx-bg-base); color: var(--nx-text);
  font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-word;
  max-height: 140px; overflow-y: auto; overscroll-behavior: contain;
}
.nx-rawtext:focus-visible { outline: 2px solid var(--nx-accent); outline-offset: 1px; }

/* 参考稿 .conflict-view / .diff-grid */
.nx-diff { margin: 8px 0 0; padding: 10px; border: 1px solid var(--nx-border);
  border-radius: var(--nx-radius-sm); background: var(--nx-bg-base); }
.nx-diff-title { font-size: 12px; font-weight: 600; color: var(--nx-warn-text); margin-bottom: 8px; }
.nx-diff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.nx-diff-box { padding: 8px 10px; border-radius: var(--nx-radius-sm); background: var(--nx-bg-card);
  border-left: 3px solid var(--nx-border-strong); font-size: 12px; color: var(--nx-text-secondary);
  max-height: 84px; overflow-y: auto; overscroll-behavior: contain; }
.nx-diff-box.old { border-left-color: var(--nx-warn); }
.nx-diff-box.new { border-left-color: var(--nx-success); }
.nx-diff-k { font-size: 11px; color: var(--nx-text-muted); margin-bottom: 3px; }

/* 列表容器在窄栏里同时是滚动区（参考稿没有这一步，窄栏必须补）。
   min-height:0 是必须的：flex 子项默认 min-height:auto 会被内容撑开 → 列表长到 542px、头部滚走。 */
html.embedded .nx-listcard { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
html.embedded .nx-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; gap: 0; }

/* 骨架屏（参考稿 .skeleton-item）：加载给形状而不是一句「加载中…」，避免布局跳动 */
.nx-skeleton { padding: 4px 0; }
.nx-skeleton-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; }
.nx-skeleton-box { width: 15px; height: 15px; border-radius: 4px; background: var(--nx-bg-active); animation: nx-pulse 1.4s ease-in-out infinite; }
.nx-skeleton-lines { flex: 1 1 auto; display: flex; flex-direction: column; gap: 6px; }
.nx-skeleton-lines i { height: 11px; border-radius: 4px; background: var(--nx-bg-active); animation: nx-pulse 1.4s ease-in-out infinite; }
.nx-skeleton-lines i.short { width: 34%; }
@keyframes nx-pulse { 0%, 100% { opacity: .45 } 50% { opacity: 1 } }

/* 空态 / 错误态（参考稿 .state-container） */
.nx-statebox { text-align: center; padding: 28px 16px 22px; color: var(--nx-text-tertiary); }
.nx-statebox svg { width: 34px; height: 34px; opacity: .55; }
.nx-statebox.error svg { stroke: var(--nx-error); opacity: 1; }
.nx-statebox-title { margin: 8px 0 0; font-size: 13px; color: var(--nx-text); font-weight: 600; }
.nx-statebox.error .nx-statebox-title { color: var(--nx-error-text); }
.nx-statebox-hint { margin: 6px 0 0; font-size: 12px; }
.nx-statebox .nx-btn { margin-top: 12px; }

/* 参考稿把主操作固定在底部；窄栏里只在有可保存改动时出现（否则白占一行） */
.nx-footer-bar {
  display: flex; justify-content: flex-end; gap: 8px; padding-top: 8px;
  border-top: 1px solid var(--nx-border-card); margin-top: 8px;
}

/* ---- 参考稿绝对尺寸（418 窄栏下的"一模一样"档） ---- */
/* 样例 HTML 的原始数值：卡片 16px 内边距、条目 14px、搜索 8/12、状态卡两行大数字、色条 4px 宽。
   418px 窄栏下这些比例会明显吃掉列表高度 —— 是否采用由用户定（0.7 档）。 */
/* 数值取自样例实测：content padding 24px / 区块间距 20px / 条目 padding 14px 16px / 标题 13px 1.4 */
.nx-app.reference-scale { padding: 24px; }
.nx-app.reference-scale > * + * { margin-top: 20px; }
/* 半档：保留紧凑的卡片与状态卡，只把条目做成参考稿的宽松比例（14px 内边距 / 13px 标题）
   —— 用户可能想要的就是"列表看起来像样例"这一件事 */
.nx-app.row-scale .nx-row-head { padding: 14px; gap: 12px; }
.nx-app.row-scale .nx-row-title { font-size: 13px; line-height: 1.45; }
.nx-app.row-scale .nx-row-sub { font-size: 11.5px; gap: 0 12px; }
.nx-app.row-scale .nx-check { width: 16px; height: 16px; }
.nx-app.row-scale .nx-sbar { width: 4px; height: 20px; }
.nx-app.row-scale .nx-tag { font-size: 11px; padding: 2px 8px; }
.nx-app.row-scale .nx-listcard-head { padding: 10px 14px; font-size: 12px; }
.nx-app.reference-scale .nx-progress { padding: 16px; margin-bottom: 0; }
.nx-app.reference-scale .nx-progress-head { font-size: 13px; margin-bottom: 10px; }
.nx-app.reference-scale .nx-progress-track { height: 6px; margin-bottom: 8px; }
.nx-app.reference-scale .nx-progress-legend { gap: 0 16px; justify-content: space-between; font-size: 12px; }
.nx-app.reference-scale .nx-status-card { flex-direction: column; gap: 4px; padding: 12px 6px; }
.nx-app.reference-scale .nx-status-card-value { font-size: 18px; }
.nx-app.reference-scale .nx-status-cards { gap: 12px; margin-bottom: 0; }
.nx-app.reference-scale .nx-toolbar { gap: 12px; margin-bottom: 0; }
.nx-app.reference-scale .nx-search { padding: 8px 12px; font-size: 13px; }
.nx-app.reference-scale .nx-listcard-head { padding: 10px 16px; font-size: 12px; }
.nx-app.reference-scale .nx-row-head { padding: 14px 16px; gap: 12px; }
.nx-app.reference-scale .nx-row-title { font-size: 13px; line-height: 1.4; }
.nx-app.reference-scale .nx-row-sub { font-size: 11px; gap: 0 12px; }
.nx-app.reference-scale .nx-tag { font-size: 11px; padding: 2px 8px; }
.nx-app.reference-scale .nx-check { width: 16px; height: 16px; }
.nx-app.reference-scale .nx-sbar { width: 4px; height: 20px; }

/* 动效尊重系统偏好（前庭功能敏感用户） */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

/* ---- DSH 滚动条皮肤（对齐 ui-theme scrollbar.css） ---- */
@supports not selector(::-webkit-scrollbar) {
  body, body * { scrollbar-width: thin; scrollbar-color: var(--nx-scrollbar-thumb) transparent; }
}
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { border-radius: 4px; background: var(--nx-scrollbar-thumb); }
::-webkit-scrollbar-thumb:hover { background: var(--nx-scrollbar-thumb-hover); }
::-webkit-scrollbar-corner { background: transparent; }
/* =====================================================================
   样例 HTML 的调色板（逐值抄录）—— 用户问"你认为和 HTML 一样吗"后的对照档。
   样例自带暗/亮两套（:root 与 body.light），这里同样给两套，映射到面板的 --nx-* 变量：
     卡片  #252528 / #F8F9FA        边框 #3A3A3E / #E9ECEF
     正文  #FFFFFF / #212529        次级 #A0A0A5 / #495057      弱化 #6B6B70 / #868E96
     强调  #3B82F6 / #2563EB        成功 #10B981 / #059669      警告 #F59E0B / #D97706   危险 #EF4444 / #DC2626
   圆角也照样例：卡片 10px、条目内元素 6px。
   ===================================================================== */

/* 亮色（样例 body.light）作为默认值 */
.nx-app.nx-sample {
  --nx-bg-base: #E9ECEF;
  --nx-bg-card: #F8F9FA;
  --nx-bg-card-elevated: #F8F9FA;
  --nx-bg-subtle: #F1F3F5;
  --nx-bg-hover: #F1F3F5;
  --nx-bg-active: #E9ECEF;
  --nx-bg-accent: rgba(59, 130, 246, 0.12);
  --nx-border: #E9ECEF;
  --nx-border-card: #E9ECEF;
  --nx-border-strong: #DEE2E6;
  --nx-text: #212529;
  --nx-text-secondary: #495057;
  --nx-text-tertiary: #868E96;
  --nx-text-muted: #868E96;
  --nx-accent: #2563EB;
  --nx-accent-text: #2563EB;
  --nx-primary: #2563EB;
  --nx-primary-text: #FFFFFF;
  --nx-success: #059669;
  --nx-success-text: #059669;
  --nx-warn: #D97706;
  --nx-warn-text: #D97706;
  --nx-warn-soft: rgba(245, 158, 11, 0.1);
  --nx-error: #DC2626;
  --nx-error-text: #DC2626;
  --nx-error-soft: rgba(239, 68, 68, 0.08);
  --nx-sbar-user: #059669;
  --nx-sbar-project: #D97706;
  --nx-sbar-episode: #2563EB;
  --nx-conf-high: #059669;
  --nx-conf-mid: #D97706;
  --nx-conf-low: #DC2626;
  --nx-tag-bg: rgba(0, 0, 0, 0.05);
  --nx-radius: 10px;
  --nx-radius-sm: 6px;
}

/* 暗色（样例 :root） */
body[data-ds-dark-theme] .nx-app.nx-sample {
  --nx-bg-base: #0A0A0A;
  --nx-bg-card: #252528;
  --nx-bg-card-elevated: #252528;
  --nx-bg-subtle: #1E1E20;
  --nx-bg-hover: #2A2A2E;
  --nx-bg-active: #333338;
  --nx-bg-accent: rgba(59, 130, 246, 0.15);
  --nx-border: #3A3A3E;
  --nx-border-card: #3A3A3E;
  --nx-border-strong: #4A4A50;
  --nx-text: #FFFFFF;
  --nx-text-secondary: #A0A0A5;
  --nx-text-tertiary: #6B6B70;
  --nx-text-muted: #6B6B70;
  --nx-accent: #3B82F6;
  --nx-accent-text: #3B82F6;
  --nx-primary: #3B82F6;
  --nx-primary-text: #FFFFFF;
  --nx-success: #10B981;
  --nx-success-text: #10B981;
  --nx-warn: #F59E0B;
  --nx-warn-text: #F59E0B;
  --nx-error: #EF4444;
  --nx-error-text: #EF4444;
  --nx-sbar-user: #10B981;
  --nx-sbar-project: #F59E0B;
  --nx-sbar-episode: #3B82F6;
  --nx-conf-high: #10B981;
  --nx-conf-mid: #F59E0B;
  --nx-conf-low: #EF4444;
  --nx-tag-bg: rgba(255, 255, 255, 0.06);
}

/* 样例的按钮与标签形态：
   .btn-primary 蓝底白字；.btn-add 白底黑字（主色反相）；.tag 无描边药丸 */
.nx-app.nx-sample .nx-btn.primary { background: var(--nx-accent); border-color: var(--nx-accent); color: #FFFFFF; }
.nx-app.nx-sample .nx-tag { border-color: transparent; background: var(--nx-tag-bg); color: var(--nx-text-secondary); }
.nx-app.nx-sample .nx-tag.status-active { background: rgba(16, 185, 129, 0.1); color: var(--nx-success); }
.nx-app.nx-sample .nx-tag.status-pending { background: rgba(245, 158, 11, 0.1); color: var(--nx-warn); }
.nx-app.nx-sample .nx-tag.status-needs-review { background: rgba(239, 68, 68, 0.1); color: var(--nx-error); }
.nx-app.nx-sample .nx-tag.status-archived, .nx-app.nx-sample .nx-tag.status-superseded { background: var(--nx-tag-bg); color: var(--nx-text-muted); }
.nx-app.nx-sample .nx-progress-badge.warn { background: rgba(245, 158, 11, 0.1); border-color: rgba(245, 158, 11, 0.3); color: var(--nx-warn); }
.nx-app.nx-sample .nx-progress-track { background: var(--nx-border); }
.nx-app.nx-sample .nx-status-card.on { background: rgba(59, 130, 246, 0.15); border-color: var(--nx-accent); }
/* 样例的条目悬停是极浅的叠加，不是换底色 */
.nx-app.nx-sample .nx-row:hover { background: var(--nx-bg-hover); }

/* =====================================================================
   V0.7 复刻档：照搬样例 HTML 的样式（用户定稿"一模一样"）。
   作用域：.nx-replica 内，缩写类名（.modal/.content/.status-card…）不会影响旧面板。
   与样例的三处必要改动（物理约束，写在这里备查）：
     1) .modal { width:780px } → 100% + max-width:780px（DSH 设置弹窗内容区实测 418px）
     2) body 级规则改为 .nx-replica 自身（面板是 iframe 内的一个 div，不是整页）
     3) 变量接到面板的主题开关（body[data-ds-dark-theme]），而不是 --root/--body.light 两个作用域
   ===================================================================== */

.nx-replica {
  --bg-overlay: rgba(0, 0, 0, 0.75);
  --bg-modal: #1A1A1C;
  --bg-card: #252528;
  --bg-input: #1E1E20;
  --border-color: #3A3A3E;
  --text-primary: #FFFFFF;
  --text-secondary: #A0A0A5;
  --text-muted: #6B6B70;
  --accent-blue: #3B82F6;
  --accent-green: #10B981;
  --accent-orange: #F59E0B;
  --accent-red: #EF4444;
  --shadow-color: rgba(0, 0, 0, 0.9);
  --hover-bg: rgba(255, 255, 255, 0.03);
  --detail-bg: rgba(0, 0, 0, 0.15);
  --skeleton-bg: #2A2A2E;
  --skeleton-shine: rgba(255, 255, 255, 0.05);
  min-height: 100%;
  background: #E9ECEF;
}
body[data-ds-dark-theme] .nx-replica { background: #0A0A0A; }
.nx-replica.light-mode,
.nx-replica.replica-light {
  --bg-overlay: rgba(0, 0, 0, 0.4);
  --bg-modal: #FFFFFF;
  --bg-card: #F8F9FA;
  --bg-input: #F1F3F5;
  --border-color: #E9ECEF;
  --text-primary: #212529;
  --text-secondary: #495057;
  --text-muted: #868E96;
  --accent-blue: #2563EB;
  --accent-green: #059669;
  --accent-orange: #D97706;
  --accent-red: #DC2626;
  --shadow-color: rgba(0, 0, 0, 0.1);
  --hover-bg: rgba(0, 0, 0, 0.03);
  --detail-bg: rgba(0, 0, 0, 0.02);
  --skeleton-bg: #E9ECEF;
  --skeleton-shine: rgba(255, 255, 255, 0.6);
  background: #E9ECEF;
}

.nx-replica, .nx-replica *, .nx-replica *::before, .nx-replica *::after { box-sizing: border-box; }
.nx-replica { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; color: var(--text-primary); }
.nx-replica .overlay { position: fixed; inset: 0; background: var(--bg-overlay); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; }

/* 样例是 780px 固定宽弹窗；这里 100% + 上限（见文件头第 1 条） */
.nx-replica .modal { width: 100%; max-width: 780px; background: var(--bg-modal); border: 1px solid var(--border-color); border-radius: 12px; box-shadow: 0 20px 50px var(--shadow-color); display: flex; flex-direction: column; max-height: 92vh; }

.nx-replica .header { padding: 20px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
.nx-replica .header h2 { margin: 0; font-size: 16px; font-weight: 600; }
.nx-replica .header-right { display: flex; gap: 16px; align-items: center; }
.nx-replica .theme-toggle { cursor: pointer; font-size: 16px; user-select: none; transition: transform 0.3s; background: transparent; border: 0; padding: 0; color: inherit; }
.nx-replica .theme-toggle:hover { transform: scale(1.1); }
.nx-replica .header .close { color: var(--text-secondary); cursor: pointer; font-size: 18px; transition: color 0.2s; background: transparent; border: 0; padding: 0; }
.nx-replica .header .close:hover { color: var(--text-primary); }

.nx-replica .content { padding: 24px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 20px; min-height: 0; }
/* 样例的 .content 子项默认 flex-shrink:1 —— 它只有 4 条数据所以看不出来；
   真实库有几十条时，列表会把设置条/状态卡压扁（实测设置条被压成 2px）。这里显式禁止收缩。 */
.nx-replica .content > * { flex-shrink: 0; }
.nx-replica .content::-webkit-scrollbar { width: 6px; }
.nx-replica .content::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }

/* 进度条与状态卡片 */
.nx-replica .progress-section { background: var(--bg-card); padding: 16px; border-radius: 10px; border: 1px solid var(--border-color); }
.nx-replica .progress-header { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); margin-bottom: 10px; }
.nx-replica .progress-header .badge { background: rgba(245, 158, 11, 0.1); color: var(--accent-orange); padding: 2px 8px; border-radius: 12px; border: 1px solid rgba(245, 158, 11, 0.3); font-size: 11px; cursor: pointer; }
.nx-replica .progress-bar { height: 6px; background: var(--border-color); border-radius: 3px; display: flex; overflow: hidden; margin-bottom: 8px; }
.nx-replica .progress-bar div { cursor: pointer; transition: opacity 0.2s; }
.nx-replica .progress-bar div:hover { opacity: 0.8; }
.nx-replica .progress-bar .user { background: var(--accent-blue); }
.nx-replica .progress-bar .project { background: var(--accent-green); }
.nx-replica .progress-bar .episode { background: var(--accent-orange); }
.nx-replica .progress-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); }

.nx-replica .status-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.nx-replica .status-card { background: var(--bg-card); border: 1px solid var(--border-color); padding: 14px; border-radius: 10px; text-align: center; font-size: 13px; color: var(--text-secondary); cursor: pointer; transition: all 0.2s; font-family: inherit; }
.nx-replica .status-card:hover { border-color: var(--accent-blue); background: rgba(59, 130, 246, 0.05); }
.nx-replica .status-card.active-filter { border-color: var(--accent-blue); background: rgba(59, 130, 246, 0.15); }
.nx-replica .status-card span { display: block; font-size: 18px; font-weight: 600; margin-top: 6px; color: var(--text-primary); }
.nx-replica .status-card.active span { color: var(--accent-green); }
.nx-replica .status-card.warning span { color: var(--accent-orange); }

/* 设置区 */
.nx-replica .settings-panel { background: var(--bg-card); border-radius: 10px; border: 1px solid var(--border-color); overflow: hidden; }
.nx-replica .settings-header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; width: 100%; background: transparent; border: 0; color: inherit; font-family: inherit; text-align: left; }
.nx-replica .settings-header h3 { margin: 0; font-size: 14px; font-weight: 600; }
.nx-replica .settings-header .arrow { transition: transform 0.3s; font-size: 12px; color: var(--text-muted); }
.nx-replica .settings-panel.collapsed .settings-header .arrow { transform: rotate(-90deg); }
.nx-replica .settings-body-wrapper { display: grid; grid-template-rows: 1fr; transition: grid-template-rows 0.3s ease; }
.nx-replica .settings-panel.collapsed .settings-body-wrapper { grid-template-rows: 0fr; }
.nx-replica .settings-body-inner { overflow: hidden; min-height: 0; }
.nx-replica .settings-body { padding: 0 20px 20px 20px; }
.nx-replica .form-row { display: flex; gap: 16px; margin-bottom: 16px; }
.nx-replica .form-row .form-group { flex: 1; }
.nx-replica .form-group label { display: block; font-size: 13px; margin-bottom: 8px; }
.nx-replica .input-box { width: 100%; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-primary); padding: 10px; border-radius: 6px; font-size: 13px; font-family: inherit; }
.nx-replica .help-text { background: var(--detail-bg); padding: 12px; border-radius: 6px; font-size: 12px; color: var(--text-muted); border-left: 3px solid var(--border-color); }

/* 列表工具栏 */
.nx-replica .list-toolbar { display: flex; gap: 12px; margin-bottom: 12px; }
.nx-replica .search-input { flex: 1; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-primary); padding: 8px 12px; border-radius: 6px; font-size: 13px; font-family: inherit; }
.nx-replica .search-input:focus { outline: none; border-color: var(--accent-blue); }
.nx-replica .btn-add { background: var(--text-primary); color: var(--bg-modal); border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; }

/* 批量操作栏 */
.nx-replica .batch-bar { display: none; background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); padding: 10px 16px; border-radius: 8px; margin-bottom: 12px; align-items: center; justify-content: space-between; font-size: 13px; color: var(--accent-blue); }
.nx-replica .batch-bar.show { display: flex; }
.nx-replica .batch-bar button { background: transparent; border: 1px solid rgba(59, 130, 246, 0.5); color: var(--accent-blue); padding: 4px 12px; border-radius: 4px; font-size: 12px; cursor: pointer; margin-left: 8px; font-family: inherit; }
.nx-replica .batch-bar button:hover { background: rgba(59, 130, 246, 0.2); }

/* 列表容器与条目 */
.nx-replica .list-container { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; min-height: 200px; position: relative; max-height: 52vh; overflow-y: auto; }
.nx-replica .list-header { position: sticky; top: 0; z-index: 2; }
.nx-replica .load-more { padding: 12px 16px; text-align: center; border-top: 1px solid var(--border-color); }
.nx-replica .load-more button { background: transparent; border: 1px solid var(--border-color); color: var(--text-primary); padding: 6px 16px; border-radius: 6px; font-size: 12px; cursor: pointer; font-family: inherit; }
.nx-replica .load-more button:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
.nx-replica .list-header { display: flex; justify-content: space-between; padding: 10px 16px; font-size: 12px; color: var(--text-muted); background: var(--detail-bg); border-bottom: 1px solid var(--border-color); }
.nx-replica .list-header label { display: flex; align-items: center; gap: 6px; cursor: pointer; }

.nx-replica .list-item { border-bottom: 1px solid var(--border-color); cursor: pointer; transition: background 0.2s; position: relative; outline: none; }
.nx-replica .list-item:last-child { border-bottom: none; }
.nx-replica .list-item:hover { background: var(--hover-bg); }
.nx-replica .list-item.focused { background: var(--hover-bg); box-shadow: inset 2px 0 0 var(--accent-blue); }
.nx-replica .list-item.hidden { display: none; }
.nx-replica .list-item-main { display: flex; align-items: center; padding: 14px 16px; }
.nx-replica .list-item-main input[type="checkbox"] { margin-right: 14px; accent-color: var(--accent-blue); width: 16px; height: 16px; flex-shrink: 0; }

.nx-replica .item-meta { display: flex; flex-direction: column; flex: 1; min-width: 0; margin-right: 12px; }
.nx-replica .item-title { font-size: 13px; color: var(--text-primary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; margin-bottom: 4px; }
.nx-replica .item-sub { font-size: 11px; color: var(--text-muted); display: flex; gap: 12px; align-items: center; }

.nx-replica .confidence-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.nx-replica .confidence-dot.high { background: var(--accent-green); box-shadow: 0 0 6px var(--accent-green); }
.nx-replica .confidence-dot.mid { background: var(--accent-orange); box-shadow: 0 0 6px var(--accent-orange); }
.nx-replica .confidence-dot.low { background: var(--accent-red); box-shadow: 0 0 6px var(--accent-red); }

.nx-replica .tag { font-size: 11px; padding: 2px 8px; border-radius: 12px; margin-left: 12px; flex-shrink: 0; }
.nx-replica .tag.archived { background: rgba(16, 185, 129, 0.1); color: var(--accent-green); }
.nx-replica .tag.active { background: rgba(59, 130, 246, 0.1); color: var(--accent-blue); }
.nx-replica .tag.conflict { background: rgba(239, 68, 68, 0.1); color: var(--accent-red); }
.nx-replica .tag.pending { background: rgba(245, 158, 11, 0.1); color: var(--accent-orange); }
.nx-replica .list-item-main .arrow { color: var(--text-muted); margin-left: 12px; font-size: 12px; transition: transform 0.3s; flex-shrink: 0; }

.nx-replica .item-details-wrapper { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.3s ease; }
.nx-replica .list-item.expanded .item-details-wrapper { grid-template-rows: 1fr; }
.nx-replica .list-item.expanded .list-item-main .arrow { transform: rotate(180deg); }
.nx-replica .item-details-inner { overflow: hidden; min-height: 0; background: var(--detail-bg); }
.nx-replica .item-details { padding: 16px; border-top: 1px dashed var(--border-color); font-size: 12px; color: var(--text-secondary); }

.nx-replica .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.nx-replica .detail-grid div span { color: var(--text-muted); display: block; margin-bottom: 4px; font-size: 11px; }
.nx-replica .detail-grid div p { margin: 0; color: var(--text-primary); font-size: 13px; word-break: break-word; }
.nx-replica .raw-text { grid-column: span 2; background: var(--bg-input); padding: 10px; border-radius: 6px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-word; line-height: 1.5; white-space: pre-wrap; max-height: 140px; overflow-y: auto; }

.nx-replica mark { background: rgba(245, 158, 11, 0.3); color: var(--accent-orange); border-radius: 2px; padding: 0 2px; }

.nx-replica .score-display { display: flex; align-items: center; gap: 8px; }
.nx-replica .score-ring { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none; }
.nx-replica .score-ring span { background: var(--bg-card); width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; color: var(--text-primary); }
.nx-replica .score-ring.green { background: conic-gradient(var(--accent-green) 98%, var(--border-color) 0); }
.nx-replica .score-ring.blue { background: conic-gradient(var(--accent-blue) 92%, var(--border-color) 0); }
.nx-replica .score-ring.orange { background: conic-gradient(var(--accent-orange) 70%, var(--border-color) 0); }

.nx-replica .edit-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; border-top: 1px solid var(--border-color); padding-top: 12px; }
.nx-replica .edit-actions button { padding: 6px 16px; border-radius: 4px; font-size: 12px; cursor: pointer; border: none; font-family: inherit; }
.nx-replica .btn-edit { background: var(--border-color); color: var(--text-primary); }
.nx-replica .btn-save { background: var(--accent-blue); color: #fff; }
.nx-replica .btn-cancel { background: transparent; color: var(--text-muted); border: 1px solid var(--border-color) !important; }
.nx-replica .edit-input, .nx-replica .edit-textarea { width: 100%; background: var(--bg-input); border: 1px solid var(--accent-blue); color: var(--text-primary); padding: 8px; border-radius: 4px; font-size: 12px; font-family: inherit; }
.nx-replica .edit-textarea { min-height: 60px; resize: vertical; margin-top: 4px; }
.nx-replica .hidden { display: none !important; }

.nx-replica .conflict-view { background: rgba(239, 68, 68, 0.05); border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 6px; padding: 12px; margin-top: 10px; }
.nx-replica .conflict-title { color: var(--accent-red); font-weight: 600; margin-bottom: 8px; }
.nx-replica .diff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.nx-replica .diff-box { background: var(--bg-input); padding: 10px; border-radius: 4px; font-size: 12px; border-left: 3px solid; }
.nx-replica .diff-box.old { border-left-color: var(--accent-orange); opacity: 0.8; }
.nx-replica .diff-box.new { border-left-color: var(--accent-green); }
.nx-replica .diff-actions { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; }
.nx-replica .diff-actions button { padding: 4px 12px; font-size: 11px; border-radius: 4px; border: 1px solid; background: transparent; cursor: pointer; font-family: inherit; }
.nx-replica .btn-keep-old { border-color: var(--accent-orange); color: var(--accent-orange); }
.nx-replica .btn-use-new { border-color: var(--accent-green); color: var(--accent-green); }

/* 骨架屏 */
.nx-replica .skeleton-item { padding: 14px 16px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 14px; }
.nx-replica .skeleton-checkbox { width: 16px; height: 16px; border-radius: 4px; background: var(--skeleton-bg); animation: nx-r-pulse 1.5s infinite; }
.nx-replica .skeleton-text { flex: 1; display: flex; flex-direction: column; gap: 8px; }
.nx-replica .skeleton-line { height: 12px; border-radius: 4px; background: var(--skeleton-bg); animation: nx-r-pulse 1.5s infinite; }
.nx-replica .skeleton-line.short { width: 30%; }
@keyframes nx-r-pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

/* 空态 / 错误态 */
.nx-replica .state-container { text-align: center; padding: 40px 20px; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.nx-replica .state-container svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: 0.5; }
.nx-replica .state-container p { margin: 0; font-size: 14px; }
.nx-replica .state-container .sub { font-size: 12px; margin-top: 8px; }
.nx-replica .btn-retry { margin-top: 16px; padding: 6px 16px; background: transparent; border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 4px; cursor: pointer; transition: all 0.2s; font-family: inherit; }
.nx-replica .btn-retry:hover { background: var(--hover-bg); border-color: var(--accent-blue); color: var(--accent-blue); }

/* 右键菜单 */
.nx-replica .context-menu { position: fixed; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; box-shadow: 0 10px 30px var(--shadow-color); padding: 6px 0; z-index: 10000; }
.nx-replica .context-menu-item { padding: 8px 16px; font-size: 13px; cursor: pointer; color: var(--text-primary); display: flex; align-items: center; gap: 8px; }
.nx-replica .context-menu-item:hover { background: var(--accent-blue); color: #fff; }
.nx-replica .context-menu-item.danger { color: var(--accent-red); }
.nx-replica .context-menu-item.danger:hover { background: var(--accent-red); color: #fff; }

/* Toast */
.nx-replica .toast { position: fixed; top: 24px; right: 24px; background: var(--accent-green); color: #000; padding: 12px 24px; border-radius: 8px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 16px; box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3); transform: translateY(-20px); opacity: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none; z-index: 9999; }
.nx-replica .toast.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
.nx-replica .btn-undo { background: rgba(0, 0, 0, 0.2); border: none; color: #000; padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold; font-family: inherit; }
.nx-replica .btn-undo:hover { background: rgba(0, 0, 0, 0.4); color: #fff; }

.nx-replica .footer { padding: 16px 24px; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; background: var(--bg-modal); border-radius: 0 0 12px 12px; flex-shrink: 0; }
.nx-replica .btn-primary { background: var(--accent-blue); color: #FFF; border: none; padding: 10px 24px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; }
.nx-replica .btn-primary:disabled { opacity: 0.5; cursor: default; }

/* Toast / 右键菜单在 DOM 上挂在 body 下（fixed 定位，避免被 .content 的 overflow 裁掉），
   所以它们自己的样式不能再依赖 .nx-replica 祖先选择器。变量在 .nx-replica 上定义，
   body 下取不到 —— 这里显式再声明一份（值同文件头，改动时两处一起改）。 */
body { --nxr-card: #252528; --nxr-border: #3A3A3E; --nxr-text: #FFFFFF; --nxr-muted: #6B6B70; --nxr-blue: #3B82F6; --nxr-green: #10B981; --nxr-red: #EF4444; }
body.replica-light-ctx { --nxr-card: #FFFFFF; --nxr-border: #E9ECEF; --nxr-text: #212529; --nxr-muted: #868E96; --nxr-blue: #2563EB; --nxr-green: #059669; --nxr-red: #DC2626; }
#toast { position: fixed; top: 24px; right: 24px; background: var(--nxr-green); color: #000; padding: 12px 24px; border-radius: 8px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 16px; box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3); transform: translateY(-20px); opacity: 0; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none; z-index: 9999; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
#toast.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
#toast .btn-undo { background: rgba(0, 0, 0, 0.2); border: none; color: #000; padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold; font-family: inherit; }
#toast .btn-undo:hover { background: rgba(0, 0, 0, 0.4); color: #fff; }
#contextMenu { position: fixed; background: var(--nxr-card); border: 1px solid var(--nxr-border); border-radius: 8px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); padding: 6px 0; z-index: 10000; font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
#contextMenu .context-menu-item { padding: 8px 16px; font-size: 13px; cursor: pointer; color: var(--nxr-text); display: flex; align-items: center; gap: 8px; }
#contextMenu .context-menu-item:hover { background: var(--nxr-blue); color: #fff; }
#contextMenu .context-menu-item.danger { color: var(--nxr-red); }
#contextMenu .context-menu-item.danger:hover { background: var(--nxr-red); color: #fff; }

/* =====================================================================
   V0.8 面板 B 的样式（用户附件第二版，选定为面板主体）。
   类名沿用 B 的命名——.status-strip/.panel/.mem-card/.lib-item/.settings-section
   等在旧面板（.nx-*）里不存在，不会冲突；调色板也照 B 原样（更深的暗色系）。
   `_shots/b-panel-scoped-auto.css` 是"把 B 原 CSS 自动加作用域"的版本（240 条规则），
   留作对照；本文件是它的整理版：同值、按区块排列、补齐交互态。
   ===================================================================== */

.nx-b {
  --bg: #0A0A0C;
  --bg-panel: #131316;
  --bg-card: #1A1A1E;
  --bg-hover: #1F1F24;
  --bg-input: #16161A;
  --bg-active: #23232A;
  /* 原 #26262C 对卡片只有 1.15:1 —— 卡片因此没有形体；用宿主的 rgba(255,255,255,.12) */
  --border: rgba(255, 255, 255, 0.12);
  --border-soft: rgba(255, 255, 255, 0.07);
  --text: #E8E8EC;
  --text-2: #9494A0;
  /* 三级文字原样是 B 的 #5E5E6A，但它在面板底上只有 2.90:1（正文要 ≥4.5）——
     大量 11–12px 的辅助信息（时间/条数/来源）都用它。提到 #868692：面板 5.16 / 卡片 4.82 / 页底 5.50。 */
  --text-3: #9096A2;
  --green: #10B981;
  --green-bg: rgba(16, 185, 129, 0.08);
  --orange: #F59E0B;
  --orange-bg: rgba(245, 158, 11, 0.08);
  --red: #EF4444;
  --red-bg: rgba(239, 68, 68, 0.08);
  --blue: #3B82F6;
  /* 白字按钮要 ≥4.5:1：#3B82F6 只有 3.68:1，蓝-600 是 5.17:1 */
  --blue-strong: #2563EB;
  --blue-bg: rgba(59, 130, 246, 0.1);
  --radius: 8px;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
  font-size: var(--nx-content-font-size, 13px);
  font-variant-numeric: tabular-nums;
  min-height: 100%;
}
.nx-b *, .nx-b *::before, .nx-b *::after { box-sizing: border-box; }

/* 原型 B 的 .overlay 规则在移植时整段丢了（只有 _shots/b-panel-scoped-auto.css 那份旧备份里有），
   后果：面板退回普通流块、「点面板外关闭」成死代码、状态条 + 92vh 导致 7px 文档溢出 + 两条滚动条。
   这里补回来，并把 max-height 改成"可用高"（用 --nx-b-available 由 JS 按宿主视口写入，回退 92vh）。 */
.nx-b .overlay { position: fixed; inset: 0; display: flex; align-items: flex-start; justify-content: center;
  padding: 8px; background: rgba(0, 0, 0, 0.55); z-index: 40; }
.nx-b .panel { width: 100%; max-width: 420px; max-height: min(92vh, calc(var(--nx-b-available, 100vh) - 16px)); display: flex; flex-direction: column;
  background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6); overflow: hidden; }
.nx-b .panel-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid var(--border); flex: none; }
.nx-b .panel-title { font-size: 15px; font-weight: 600; }
.nx-b .panel-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 12px 14px 16px; }
.nx-b .panel-body::-webkit-scrollbar { width: 6px; }
.nx-b .panel-body::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.18); border-radius: 3px; }
.nx-b :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.nx-b .close-btn { background: transparent; border: 0; color: var(--text-2); font-size: 16px; cursor: pointer;
  padding: 2px 6px; border-radius: 6px; font-family: inherit; flex: none; margin-left: auto; align-self: center; }
.nx-b .close-btn:hover { background: var(--bg-hover); color: var(--text); }

/* 顶部状态条 */
.nx-b .status-strip { display: flex; align-items: center; gap: 8px; padding: 10px 12px;
  background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius);
  cursor: pointer; transition: border-color .15s, background .15s; font-size: 12.5px; }
.nx-b .status-strip:hover { border-color: var(--blue); background: var(--bg-hover); }
.nx-b .status-strip:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.nx-b .status-strip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex: none; }
.nx-b .status-strip .dot.warn { background: var(--orange); }
.nx-b .status-strip .dot.readonly { background: var(--text-3); }
.nx-b .status-strip .dot.paused { background: var(--red); }
.nx-b .status-strip .primary { color: var(--text); font-weight: 600; }
.nx-b .status-strip .sep { width: 1px; height: 12px; background: var(--border); flex: none; }
.nx-b .status-strip .warn-txt { color: var(--orange); font-weight: 600; }
.nx-b .status-strip .expand { margin-left: auto; color: var(--text-3); font-size: 11px; }

/* 模式 + 预算 */
.nx-b .mode-budget-row { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--border); flex: none; flex-wrap: wrap; }
.nx-b .mode-group { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; flex: none; }
.nx-b .mode-btn { background: transparent; border: 0; color: var(--text-2); font: inherit; font-size: 12px; padding: 5px 10px; cursor: pointer; }
.nx-b .mode-btn:hover { background: var(--bg-hover); color: var(--text); }
.nx-b .mode-btn.active { background: var(--blue-bg); color: var(--blue); font-weight: 600; }
.nx-b .mode-btn.active[data-mode="readonly"] { background: var(--bg-active); color: var(--text-2); }
.nx-b .mode-btn.active[data-mode="paused"] { background: var(--red-bg); color: var(--red); }
.nx-b .budget-mini { flex: 1 1 120px; min-width: 0; }
.nx-b .budget-mini-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 12px; margin-bottom: 4px; }
.nx-b .budget-mini-top strong { color: var(--text); font-variant-numeric: tabular-nums; white-space: nowrap; }
.nx-b .budget-mini-counts { color: var(--text-3); font-size: 11px; white-space: nowrap; }
.nx-b .budget-mini-bar { display: flex; height: 5px; border-radius: 3px; overflow: hidden; background: var(--bg-active); }
.nx-b .budget-mini-bar .seg { height: 100%; flex-grow: 1; flex-basis: 0; }
.nx-b .budget-mini-bar .seg[data-scope="global"] { background: var(--blue); }
.nx-b .budget-mini-bar .seg[data-scope="project"] { background: var(--green); }
.nx-b .budget-mini-bar .seg[data-scope="session"] { background: var(--orange); }

/* 统计行：单行 chip（窄栏实测双行卡占 64px，改单行约 30px ≈ 多半张记忆卡） */
.nx-b .stats-row { display: flex; align-items: center; gap: 6px 12px; flex-wrap: wrap;
  padding: 8px 16px; border-bottom: 1px solid var(--border); flex: none; }
.nx-b .stat-inline { font-size: 11.5px; color: var(--text-3); white-space: nowrap; }
.nx-b .stat-inline b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; margin-left: 3px; }
.nx-b .stat-inline b.green { color: var(--green); }
.nx-b .stat-inline b.orange { color: var(--orange); }
.nx-b .stat-inline b.dim { color: var(--text-2); }

/* 标签页 */
.nx-b .tabs { display: flex; border-bottom: 1px solid var(--border); flex: none; }
.nx-b .tab { flex: 1 1 0; background: transparent; border: 0; color: var(--text-2); font: inherit; font-size: 12.5px;
  padding: 10px 4px; cursor: pointer; position: relative; display: flex; align-items: center; justify-content: center; gap: 5px; }
.nx-b .tab:hover { color: var(--text); background: var(--bg-hover); }
.nx-b .tab.active { color: var(--text); font-weight: 600; }
.nx-b .tab.active::after { content: ''; position: absolute; left: 12%; right: 12%; bottom: -1px; height: 2px; background: var(--blue); border-radius: 2px 2px 0 0; }
.nx-b .tab .badge { font-size: 10.5px; padding: 1px 5px; border-radius: 999px; background: var(--bg-active); color: var(--text-2); font-variant-numeric: tabular-nums; }
.nx-b .tab.active .badge { background: var(--blue-bg); color: var(--blue); }
.nx-b .tab .badge.warn { background: var(--orange-bg); color: var(--orange); }
.nx-b .tab-panel { display: none; }
.nx-b .tab-panel.active { display: block; }

/* 误写记忆横幅 */
.nx-b .banner { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid var(--orange);
  background: var(--orange-bg); border-radius: var(--radius); margin-bottom: 10px; flex-wrap: wrap; }
.nx-b .banner .banner-text { flex: 1 1 160px; font-size: 12.5px; color: var(--text-2); line-height: 1.5; }
.nx-b .banner .banner-text strong { color: var(--text); }
.nx-b .banner button { background: transparent; border: 1px solid var(--border); color: var(--text-2); border-radius: 6px; font: inherit; font-size: 12px; padding: 3px 9px; cursor: pointer; flex: none; }
.nx-b .banner button:hover { border-color: var(--orange); color: var(--orange); }

/* 归因分组 */
.nx-b .reason-group { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; overflow: hidden; background: var(--bg-panel); }
/* 组头原来是 12.5px/400 与卡片正文同色同重，唯一区分是 1.07:1 的底色 —— 分组看不出来。
   现在做成标题带：加重 + 次级色 + 底色差。 */
.nx-b .reason-header { display: flex; align-items: center; gap: 8px; padding: 7px 10px; cursor: pointer;
  font-size: 12px; font-weight: 600; color: var(--text-2); background: var(--bg-active); }
.nx-b .reason-header:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
.nx-b .reason-header:hover { background: var(--bg-hover); }
.nx-b .reason-header .caret { color: var(--text-3); font-size: 10px; transition: transform .18s; }
.nx-b .reason-group.collapsed .reason-header .caret { transform: rotate(-90deg); }
.nx-b .reason-header .marker { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.nx-b .reason-header .marker.in { background: var(--green); }
.nx-b .reason-header .marker.out { background: var(--text-3); }
.nx-b .reason-header .marker.warn { background: var(--orange); }
.nx-b .reason-header .label { flex: 1 1 auto; }
.nx-b .reason-header .count { color: var(--text-3); font-variant-numeric: tabular-nums; }
.nx-b .reason-group.collapsed .reason-body { display: none; }
.nx-b .reason-body { border-top: 1px solid var(--border); padding: 8px; display: flex; flex-direction: column; gap: 6px; }

/* 记忆卡 */
/* 卡片回到比容器更亮的一档（原来 card 用 --bg-panel 比容器 --bg-card 更暗，看着像凹陷） */
.nx-b .mem-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; }
.nx-b .mem-card-title { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.nx-b .mem-card:hover { border-color: var(--text-3); }
.nx-b .mem-card.pinned { border-left: 2px solid var(--orange); }
.nx-b .mem-card.selected { border-color: var(--blue); background: var(--blue-bg); }
.nx-b .mem-card-head { display: flex; align-items: flex-start; gap: 8px; }
.nx-b .mem-card-title { flex: 1 1 auto; min-width: 0; font-size: 13px; line-height: 1.45; word-break: break-word; }
.nx-b .mem-card-size { flex: none; font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.nx-b .mem-card-size.over { color: var(--orange); font-weight: 600; }
.nx-b .mem-card-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 5px; font-size: 11px; color: var(--text-3); }
.nx-b .mem-card-meta .conf-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); flex: none; }
.nx-b .mem-card-meta .conf-dot.high { background: var(--green); }
.nx-b .mem-card-meta .conf-dot.mid { background: var(--orange); }
.nx-b .mem-card-meta .conf-dot.low { background: var(--red); }
.nx-b .mem-card-meta .sep-dot { color: var(--text-3); opacity: .6; }
.nx-b .mem-card-meta .pin-flag { color: var(--orange); }
.nx-b .mem-card-why { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 11.5px; }
.nx-b .mem-card-why .why-text { flex: 1 1 auto; color: var(--text-3); }
.nx-b .mem-card-why .why-text.warn { color: var(--orange); }
/* ⋯ 常显（原 opacity:0 只有 hover 才出现 → 触屏/键盘进不去，而它是归因卡上唯一的操作入口） */
.nx-b .mem-card-more { background: transparent; border: 0; color: var(--text-3); cursor: pointer; font-size: 14px;
  padding: 4px 7px; border-radius: 5px; opacity: .55; transition: opacity .12s, background .12s; font-family: inherit; }
.nx-b .mem-card:hover .mem-card-more, .nx-b .mem-card-more:focus-visible { opacity: 1; background: var(--bg-hover); }
.nx-b .mem-card-more:hover { color: var(--text); }

.nx-b .mini-btn { background: transparent; border: 1px solid var(--border); color: var(--text-2); border-radius: 5px; font: inherit; font-size: 11.5px; padding: 2px 8px; cursor: pointer; }
